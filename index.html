function bindGraphCanvas(){
  const cv=$('#graphCv'); if(!cv) return;
  const st=S.graphState, L=S.graphLayout;
  const W=920,H=470;
  let drag=null, moved=false;
  const rectOf=()=>cv.getBoundingClientRect();
  const toLog=e=>{ const r=rectOf(); return {x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height)}; };
  const hit=p=>{ const wx=(p.x-st.view.x)/st.view.k, wy=(p.y-st.view.y)/st.view.k;
    for(let i=L.nodes.length-1;i>=0;i--){ const n=L.nodes[i];
      const dx=wx-n.x, dy=wy-n.y; if(dx*dx+dy*dy<=(n.r+4)*(n.r+4)) return n; } return null; };
  cv.addEventListener('pointerdown',e=>{
    cv.setPointerCapture(e.pointerId);
    const p=toLog(e); const n=hit(p); moved=false;
    drag = n? {type:'node',n,ox:p.x,oy:p.y,nx:n.x,ny:n.y} : {type:'pan',ox:p.x,oy:p.y,vx:st.view.x,vy:st.view.y};
  });
  cv.addEventListener('pointermove',e=>{
    const p=toLog(e);
    if(drag){
      const dx=p.x-drag.ox, dy=p.y-drag.oy;
      if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
      if(drag.type==='node'){ drag.n.x=drag.nx+dx/st.view.k; drag.n.y=drag.ny+dy/st.view.k; }
      else { st.view.x=drag.vx+dx; st.view.y=drag.vy+dy; }
      drawGraph();
    } else {
      const n=hit(p);
      cv.style.cursor=n?'pointer':'grab';
      const tip=$('#gTip');
      if(tip){ if(n){ const r=rectOf();
          tip.style.left=(e.clientX-r.left)+'px'; tip.style.top=(e.clientY-r.top)+'px';
          tip.textContent=n.term+' · '+n.count+'× · '+n.docsCount+' doc(s)'; tip.style.display='block';
        } else tip.style.display='none'; }
    }
  });
  const up=e=>{ if(drag&&!moved){ const p=toLog(e); const n=hit(p);
      st.sel = n? (st.sel===n.term?null:n.term) : null;
      renderGraphDetail(); drawGraph(); }
    drag=null; };
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',()=>drag=null);
  cv.addEventListener('wheel',e=>{
    e.preventDefault();
    const p=toLog(e);
    const wx=(p.x-st.view.x)/st.view.k, wy=(p.y-st.view.y)/st.view.k;
    const k2=Math.min(3,Math.max(0.5, st.view.k*(e.deltaY<0?1.12:0.89)));
    st.view.k=k2; st.view.x=p.x-wx*k2; st.view.y=p.y-wy*k2;
    drawGraph();
  },{passive:false});
  cv.addEventListener('mouseleave',()=>{ const tip=$('#gTip'); if(tip) tip.style.display='none'; });
}

/* ============ DATA LAB ============ */
function toNum(v){ if(typeof v==='number') return isFinite(v)?v:null;
  const s=String(v??'').replace(/[$₹€£,%\s]/g,''); if(s===''||s==='-') return null;
  const n=Number(s); return isFinite(n)?n:null; }
function numStats(vals){
  if(!vals.length) return null;
  const n=vals.length, sorted=[...vals].sort((a,b)=>a-b);
  const mean=vals.reduce((a,b)=>a+b,0)/n;
  const med = n%2? sorted[(n-1)/2] : (sorted[n/2-1]+sorted[n/2])/2;
  const varr = n>1? vals.reduce((a,b)=>a+(b-mean)*(b-mean),0)/(n-1) : 0;
  return {n, mean, med, min:sorted[0], max:sorted[n-1], std:Math.sqrt(varr)};
}
function inferCol(rows, get){
  let num=0, total=0;
  for(let i=0;i<rows.length&&total<200;i++){
    const v=get(rows[i]); if(v===''||v==null) continue; total++;
    if(toNum(v)!=null) num++;
  }
  if(total && num/total>=0.8){
    const vals=rows.map(get).map(toNum).filter(v=>v!=null);
    return {type:'numeric', stats:numStats(vals)};
  }
  const counts=new Map(); let missing=0;
  rows.forEach(r=>{ const s=String(get(r)??'').trim(); if(!s){missing++;return;} counts.set(s,(counts.get(s)||0)+1); });
  const top=[...counts.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8);
  return {type:'categorical', unique:counts.size, missing, top};
}
async function ingestDataset(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(!['csv','xlsx','xls'].includes(ext)) throw 'Data Lab accepts .csv, .xlsx, .xls — got .'+ext;
  if(file.size>MAX_SIZE) throw 'File exceeds the 20 MB limit.';
  if(!window.XLSX) throw 'Spreadsheet engine failed to load (offline?).';
  let wb;
  if(ext==='csv'){ const text=await readFile(file,'text'); wb=XLSX.read(text,{type:'string'}); }
  else { const ab=await readFile(file,'ab'); wb=XLSX.read(new Uint8Array(ab),{type:'array'}); }
  const ws=wb.Sheets[wb.SheetNames[0]];
  const arr=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  if(arr.length<2) throw 'Need a header row and at least one data row.';
  const seen=new Map();
  let header=arr[0].map((h,i)=>{ let h2=String(h??'').trim()||('Column '+(i+1));
    const c=seen.get(h2)||0; seen.set(h2,c+1); return c? h2+' ('+(c+1)+')' : h2; });
  let rows=arr.slice(1).filter(r=>r.some(v=>v!==''&&v!=null));
  let note='';
  if(rows.length>5000){ rows=rows.slice(0,5000); note=' — truncated to first 5,000 rows'; }
  if(header.length>40){ header=header.slice(0,40); rows=rows.map(r=>r.slice(0,40)); note+=' — truncated to first 40 columns'; }
  const cols=header.map((h,i)=>inferCol(rows, r=>r[i]));
  const ds={id:uid(), userId:S.user.id, title:file.name.replace(/\.[^.]+$/,''), addedAt:nowISO(),
    sheet:wb.SheetNames[0], header, cols, data:rows, rowCount:rows.length};
  await idbPut('datasets', ds); S.datasets.unshift(ds);
  toast(`Dataset “${ds.title}” loaded — ${rows.length} rows × ${header.length} columns${note}.`,'ok');
  renderIfActive('datalab');
}
function pearson(xs,ys){
  const n=xs.length; if(n<3) return null;
  const mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;
  let cov=0,sx=0,sy=0;
  for(let i=0;i<n;i++){ const dx=xs[i]-mx, dy=ys[i]-my; cov+=dx*dy; sx+=dx*dx; sy+=dy*dy; }
  if(!sx||!sy) return null;
  return cov/Math.sqrt(sx*sy);
}
function groupBy(ds, gi, vi, agg){
  const m=new Map();
  ds.data.forEach(r=>{
    const k=String(r[gi]??'').trim()||'(blank)';
    const v=toNum(r[vi]);
    if(agg!=='count' && v==null) return;
    const a=m.get(k)||{n:0,sum:0,min:Infinity,max:-Infinity};
    a.n++; if(v!=null){ a.sum+=v; a.min=Math.min(a.min,v); a.max=Math.max(a.max,v); }
    m.set(k,a);
  });
  const out=[...m.entries()].map(([k,a])=>({label:k,
    value: agg==='count'?a.n : agg==='sum'?a.sum : agg==='min'?a.min : agg==='max'?a.max : (a.n?a.sum/a.n:0)}));
  out.sort((a,b)=>b.value-a.value);
  return out;
}

function drawDlHist(ds, colIdx){
  const cv=$('#dlHist'); if(!cv) return;
  const vals=ds.data.map(r=>toNum(r[colIdx])).filter(v=>v!=null);
  const info=$('#dlHistInfo');
  const stats=numStats(vals);
  if(info) info.textContent = stats? `n=${stats.n} · mean ${fmtN(stats.mean)} · median ${fmtN(stats.med)} · std ${fmtN(stats.std)}`:'no numeric values';
  if(!cv||!stats||vals.length<5) return;
  const W=760,H=240, ctx=setupCanvas(cv,W,H);
  const pad={l:40,r:12,t:14,b:34};
  const bins=Math.min(20,Math.max(5,Math.ceil(Math.log2(vals.length)+1)));
  const lo=stats.min, hi=stats.max, span=(hi-lo)||1, bw=span/bins;
  const counts=new Array(bins).fill(0);
  vals.forEach(v=>{ let b=Math.floor((v-lo)/bw); if(b>=bins)b=bins-1; if(b<0)b=0; counts[b]++; });
  const yMax=Math.max(...counts);
  const ink3=cssVar('--ink3'), accent=cssVar('--accent'), line=cssVar('--line2');
  ctx.font='10px "Spline Sans Mono", monospace'; ctx.fillStyle=ink3;
  const ys=niceStep(yMax,4);
  for(let y=0;y<=yMax+ys*0.01;y+=ys){
    const py=pad.t+(H-pad.t-pad.b)*(1-y/yMax);
    ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(pad.l,py); ctx.lineTo(W-pad.r,py); ctx.stroke();
    ctx.textAlign='right'; ctx.fillText(fmtN(y), pad.l-6, py+3);
  }
  const iw=(W-pad.l-pad.r)/bins;
  counts.forEach((c,i)=>{
    const x=pad.l+i*iw, h=(H-pad.t-pad.b)*(c/yMax);
    ctx.fillStyle=hexToRgba(accent,0.75);
    ctx.fillRect(x+1, H-pad.b-h, iw-2, h);
  });
  ctx.fillStyle=ink3; ctx.textAlign='center';
  for(let i=0;i<=bins;i+=Math.ceil(bins/6)){
    const v=lo+i*bw;
    ctx.fillText(fmtN(v), pad.l+i*iw, H-pad.b+14);
  }
  ctx.fillText('bins of '+esc(ds.header[colIdx])+' (Sturges: '+bins+')', W/2, H-6);
}
function drawDlScatter(ds, xi, yi){
  const cv=$('#dlSc'); if(!cv) return;
  const xs=[],ys=[];
  ds.data.forEach(r=>{ const a=toNum(r[xi]), b=toNum(r[yi]); if(a!=null&&b!=null){ xs.push(a); ys.push(b); } });
  const info=$('#dlScInfo');
  const r=pearson(xs,ys);
  if(info) info.textContent = xs.length? `n=${xs.length} · r=${r==null?'—':r.toFixed(3)}`:'no paired numeric rows';
  if(!xs.length) return;
  const W=760,H=260, ctx=setupCanvas(cv,W,H);
  const pad={l:46,r:14,t:14,b:36};
  const xlo=Math.min(...xs), xhi=Math.max(...xs), xsp=(xhi-xlo)||1;
  const ylo=Math.min(...ys), yhi=Math.max(...ys), ysp=(yhi-ylo)||1;
  const ink3=cssVar('--ink3'), accent=cssVar('--accent'), line=cssVar('--line2');
  ctx.font='10px "Spline Sans Mono", monospace'; ctx.fillStyle=ink3;
  const ystep=niceStep(ysp,4);
  for(let y=Math.ceil(ylo/ystep)*ystep; y<=yhi+1e-9; y+=ystep){
    const py=pad.t+(H-pad.t-pad.b)*(1-(y-ylo)/ysp);
    ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(pad.l,py); ctx.lineTo(W-pad.r,py); ctx.stroke();
    ctx.textAlign='right'; ctx.fillText(fmtN(y), pad.l-6, py+3);
  }
  const xstep=niceStep(xsp,5);
  for(let x=Math.ceil(xlo/xstep)*xstep; x<=xhi+1e-9; x+=xstep){
    const px=pad.l+(W-pad.l-pad.r)*((x-xlo)/xsp);
    ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(px,pad.t); ctx.lineTo(px,H-pad.b); ctx.stroke();
    ctx.textAlign='center'; ctx.fillText(fmtN(x), px, H-pad.b+14);
  }
  const px=v=>pad.l+(W-pad.l-pad.r)*((v-xlo)/xsp);
  const py=v=>pad.t+(H-pad.t-pad.b)*(1-(v-ylo)/ysp);
  ctx.fillStyle=hexToRgba(accent,0.65);
  xs.forEach((x,i)=>{ ctx.beginPath(); ctx.arc(px(x),py(ys[i]),3,0,7); ctx.fill(); });
  const n=xs.length, mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;
  let num=0,den=0; for(let i=0;i<n;i++){ num+=(xs[i]-mx)*(ys[i]-my); den+=(xs[i]-mx)**2; }
  if(den>0){
    const slope=num/den, icept=my-slope*mx;
    ctx.strokeStyle=hexToRgba(cssVar('--warn'),0.9); ctx.lineWidth=1.5; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(px(xlo),py(slope*xlo+icept)); ctx.lineTo(px(xhi),py(slope*xhi+icept)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=cssVar('--warn'); ctx.textAlign='left';
    ctx.fillText('least-squares fit', pad.l+6, pad.t+12);
  }
  ctx.fillStyle=ink3; ctx.textAlign='center';
  ctx.fillText(esc(ds.header[xi]), W/2, H-4);
  ctx.save(); ctx.translate(10,H/2); ctx.rotate(-Math.PI/2); ctx.fillText(esc(ds.header[yi]),0,0); ctx.restore();
}

/* ============ TASKS & CALENDAR ============ */
function sortTasks(){
  S.tasks.sort((a,b)=>{
    if(!!a.done!==!!b.done) return a.done?1:-1;
    const da=a.due||'9999-12-31', db=b.due||'9999-12-31';
    return da<db?-1:da>db?1:0;
  });
}
function upcomingTasks(n=5){
  return S.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9999-12-31')<(b.due||'9999-12-31')?-1:1).slice(0,n);
}
function dueLabel(t){
  if(!t.due) return 'No date';
  const days=Math.ceil((new Date(t.due+'T23:59:59')-Date.now())/DAY);
  if(days<0) return 'Overdue '+Math.abs(days)+'d';
  if(days===0) return 'Today';
  if(days===1) return 'Tomorrow';
  return 'In '+days+' d';
}
function dueKind(t){
  if(!t.due) return 'dim';
  const days=Math.ceil((new Date(t.due+'T23:59:59')-Date.now())/DAY);
  return (days<=1&&!t.done)?'warn':(t.done?'dim':'dim');
}
function calGrid(y,m){
  const first=new Date(y,m,1);
  const startDow=(first.getDay()+6)%7;

  const cells=[];
  for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); cells.push(d); }
  return cells;
}

/* ============ ADVANCED VERIFICATION ============ */
const NEG_CUES=/\b(not|no|never|cannot|can't|won't|don't|doesn't|didn't|isn't|aren't|wasn't|without|neither|nor|fails?|failed|lacks?|lacked|incorrect|false|wrong|contradic\w*|refut\w*|denie[sd]|deny)\b/i;
const CONTRAST_CUES=/\b(however|although|whereas|on the contrary|in contrast|conversely|by contrast|differs?|differ|disagree\w*|dispute[sd]?|rather than|instead|oppos\w*)\b/i;
function analyzePassage(claimTokens, chunk){
  const ss=sentences(chunk.text);
  let best=null;
  for(const s of ss){
    const t=tokenize(s); if(!t.length) continue;
    const set=new Set(t);
    let hit=0; claimTokens.forEach(w=>{ if(set.has(w)) hit++; });
    const ov=hit/claimTokens.length;
    const sc=ov/Math.sqrt(t.length);
    if(!best||sc>best.sc) best={s,ov,sc,neg:NEG_CUES.test(s),contrast:CONTRAST_CUES.test(s)};
  }
  return best;
}
function runVerification(claim){
  const claimTokens=[...new Set(tokenize(claim))];
  if(claimTokens.length<2) throw 'A claim needs at least two meaningful words to verify.';
  const pool=S.chunksCache;
  if(!pool.length) throw 'Your library is empty — nothing to verify against.';
  const idx=buildIndex(pool);
  const hits=bm25(idx, claimTokens).filter(h=>h.score>=1.0).slice(0,6);
  const checks=hits.map(h=>{
    const b=analyzePassage(claimTokens, h.e.c);
    let verdict='unclear';
    if(b){
      if(b.ov>=0.45 && !b.neg && !b.contrast) verdict='aligned';
      else if((b.neg||b.contrast) && b.ov>=0.3) verdict='conflict';
      else if(b.ov>=0.25) verdict='unclear';
    }
    return {docId:h.e.c.docId, docTitle:docTitle(h.e.c.docId), page:h.e.c.page,
      excerpt: b? b.s : (bestSentences(h.e.c.text, claimTokens,1)[0] || h.e.c.text.slice(0,220)),
      overlap: b? Math.round(b.ov*100):0, verdict,
      signal: b? (b.neg?'negation cue present':b.contrast?'contrast cue present':'plain alignment'):'low overlap'};
  });
  const aligned=checks.filter(c=>c.verdict==='aligned').length;
  const conflicts=checks.filter(c=>c.verdict==='conflict').length;
  let overall,label;
  if(conflicts.length){ overall='Conflicting evidence'; label='warn'; }
  else if(aligned>=2){ overall='Supported across '+aligned+' sources'; label='ok'; }
  else if(aligned===1){ overall='Aligned with one source'; label='warn'; }
  else if(checks.length){ overall='Insufficient evidence'; label='dim'; }
  else { overall='No relevant passages in your library'; label='dim'; }
  return {claim, checks, overall, label, scanned:pool.length, at:nowISO(),
    method:'Mechanical lexical analysis: BM25 retrieval + term-overlap scoring + negation/contrast cue detection on the best-matching sentence of each passage.'};
}

function validatePack(p){
  if(!p || p.format!=='sriverse-scholar-pack') throw 'This file is not a SriVerse Scholar pack.';
  if(!Array.isArray(p.documents)) throw 'Pack is missing its documents list.';
}
function buildPack(docIds, opts){
  const ids=new Set(docIds);
  const docs=S.docs.filter(d=>ids.has(d.id)&&d.status==='ready')
    .map(d=>({id:d.id,title:d.title,type:d.type,author:d.author,date:d.date,addedAt:d.addedAt,
      pages:d.pages,pageCount:d.pageCount,wordCount:d.wordCount,chunkCount:d.chunkCount}));
  const tied=(x)=>x.docId&&ids.has(x.docId);
  return { format:'sriverse-scholar-pack', version:1,
    author:{name:S.user.name}, exportedAt:nowISO(), message:opts.message||'',
    documents:docs,
    notes: opts.notes? S.notes.filter(tied).map(n=>({title:n.title,body:n.body,docId:n.docId,sourceLabel:n.sourceLabel,kind:n.kind})) : [],
    annotations: opts.annotations? S.annotations.filter(tied).map(a=>({docId:a.docId,page:a.page,quote:a.quote,comment:a.comment,author:a.author})) : [],
    evidence: opts.evidence? S.evidence.filter(e=>!e.deleted&&tied(e)).map(e=>({docId:e.docId,docTitle:e.docTitle,page:e.page,excerpt:e.excerpt})) : [],
    flashcards: opts.flashcards? S.flashcards.filter(c=>!c.orphan&&tied(c)).map(c=>({docId:c.docId,page:c.page,front:c.front,back:c.back,sourceLabel:c.sourceLabel})) : [] };
}
async function doImport(pack){
  const author=pack.author?.name||'Unknown collaborator';
  const map=new Map(); let nDocs=0,nNotes=0,nAnnos=0,nEvid=0,nCards=0;
  for(const d of (pack.documents||[])){
    if(!d.pages||!d.pages.length) continue;
    const newId=uid(); map.set(d.id,newId);
    const doc={ id:newId, userId:S.user.id, catNo:await nextCatNo(), title:d.title||'Shared document',
      type:d.type||'TXT', author:d.author||'', date:d.date||fmtDate(Date.now()), addedAt:d.addedAt||nowISO(),
      size:0, pages:d.pages, pageCount:d.pages.length, wordCount:d.wordCount||0,
      status:'ready', statusMsg:'', projectId:null, updatedAt:nowISO(), imageData:null, importedFrom:author };
    const chunks=chunkPages(doc.pages);
    doc.chunkCount=chunks.length;
    await idbPut('documents', doc);
    for(const ch of chunks) await idbPut('chunks',{id:uid(),userId:S.user.id,docId:newId,idx:0,page:ch.page,section:null,text:ch.text});
    S.docs.unshift(doc); nDocs++;
  }
  for(const n of (pack.notes||[])){
    const note={id:uid(),userId:S.user.id,title:n.title||'Shared note',body:n.body||'',
      docId:map.get(n.docId)||null,sourceLabel:(n.sourceLabel||'')+' · via '+author,
      createdAt:nowISO(),updatedAt:nowISO(),kind:'imported'};
    await idbPut('notes',note); S.notes.unshift(note); nNotes++;
  }
  for(const a of (pack.annotations||[])){
    const an={id:uid(),userId:S.user.id,docId:map.get(a.docId)||null,page:a.page||1,
      quote:a.quote||'',comment:a.comment||'',author:a.author||author,viaPack:author,createdAt:nowISO()};
    await idbPut('annotations',an); S.annotations.unshift(an); nAnnos++;
  }
  for(const e of (pack.evidence||[])){
    const ev={id:uid(),userId:S.user.id,docId:map.get(e.docId)||null,docTitle:e.docTitle||'Document',
      page:e.page||1,excerpt:e.excerpt||'',createdAt:nowISO(),viaPack:author};
    await idbPut('evidence',ev); S.evidence.push(ev); nEvid++;
  }
  for(const c of (pack.flashcards||[])){
    const card={id:uid(),userId:S.user.id,docId:map.get(c.docId)||null,page:c.page||1,
      front:c.front||'',back:c.back||'',sourceLabel:(c.sourceLabel||'')+' · via '+author,
      state:'new',ease:2.5,interval:0,reps:0,lapses:0,due:nowISO(),createdAt:nowISO()};
    await idbPut('flashcards',card); S.flashcards.push(card); nCards++;
  }
  S.indexDirty=true; S.graphLayout=null;
  toast(`Pack imported — ${nDocs} doc(s), ${nNotes} note(s), ${nAnnos} annotation(s), ${nEvid} evidence, ${nCards} card(s), all “via ${author}”.`,'ok');
  go('#/library');
}

const ROUTES = ['home','knowledge','library','notes','search','projects','learn','teach','research','write','assess','review','quiz','datalab','graph','progress','verify','collab','settings','read'];
function parseHash(){
  const h = location.hash.replace(/^#\/?/,'');
  const [path, qs] = h.split('?');
  const seg = path.split('/').filter(Boolean);
  const params = new URLSearchParams(qs||'');
  return {view: seg[0]||'', arg: seg[1]||'', params};
}
function go(hash){ location.hash = hash; }
window.addEventListener('hashchange', route);
async function route(){
  if(!S.user){ renderAuth(); return; }
  const {view, arg, params} = parseHash();
  const v = ROUTES.includes(view)?view:'home';
  S.route = v;
  if(v==='knowledge'){
    if(params.get('doc')){ S.scope={type:'doc', id:params.get('doc')}; history.replaceState(null,'','#/knowledge'); }
    if(params.get('session')){
      const sid = params.get('session');
      if(sid!==S.activeSession) await openSession(sid);
      history.replaceState(null,'','#/knowledge');
    }
    if(params.get('q')) history.replaceState(null,'','#/knowledge');
  }
  if(v!=='knowledge' && S.pendingQuote) S.pendingQuote=null;
  if(v!=='read' && S.readerAnnoOpen) S.readerAnnoOpen=false;
  if(v==='notes' && params.get('id')){ S.activeNoteId = params.get('id'); history.replaceState(null,'','#/notes'); }
  if(v==='write' && params.get('id')){ S.activeDraftId = params.get('id'); history.replaceState(null,'','#/write'); }
  if(v==='read' && params.get('page')){ S.readerFocusPage = +params.get('page'); history.replaceState(null,'','#/read/'+arg); }
  if(v==='review'){ S.reviewDeck = params.get('deck')||'all'; history.replaceState(null,'','#/review'); }
  if(v==='quiz'){ S.quizDoc = params.get('doc')||null; history.replaceState(null,'','#/quiz'); }
  if(v==='datalab' && params.get('ds')){ S.dlState.dsId=params.get('ds'); history.replaceState(null,'','#/datalab'); }
  renderApp();
}
function renderIfActive(view){ if(S.route===view) renderApp(); }

  const evHtml = (m.evidence&&m.evidence.length)? `<div class="evidence">${m.evidence.map((e,i)=>evSlip(e,i)).join('')}</div>`:'';
  const procHtml = `<details class="process"><summary>Process &amp; transparency</summary><dl>
      <dt>Engine</dt><dd>${meta.engine==='on-device'?'On-device model server ('+esc(S.ondevice.model||'local model')+')':meta.engine==='external'?'External provider ('+esc(S.provider.model||'user model')+')':'Local retrieval engine (BM25 over '+esc(String(meta.scanned??'—'))+' passages)'}</dd>
      <dt>Scope</dt><dd>${esc(meta.scope||'—')}</dd>
      <dt>Mode</dt><dd>${S.profMode?'Professor (Socratic) · ':''}${S.sourceOnly?'Source-only':'Open (may route to a model server when configured)'}</dd>
      <dt>Retrieved</dt><dd>${esc(String(meta.retrieved??'—'))} passage(s)</dd>

      ${meta.fallbackNote?`<dt>Fallback</dt><dd>${esc(meta.fallbackNote)}</dd>`:''}
    </dl></details>`;
  return `<div class="msg ai"><div class="who">Scholar ${stampHtml}</div><div class="bubble prose">${bodyHtml}${evHtml}${procHtml}</div></div>`;

function evSlip(e, i){
  const docExists = e.docId && S.docs.some(d=>d.id===e.docId);
  return `<div class="slip ${!docExists&&!e.isSelection?'deleted':''}" data-slip="${i+1}">

      <button data-action="openEvDoc" data-doc="${e.docId}" data-page="${e.page}">Open in reader</button>

}

function bindChatInputs(){
  const ta=$('#chatInput'), f=$('#chatForm'), so=$('#srcOnly'), pm=$('#profOnly');

function renderQuoteHolder(){

}
async function doSend(){
  if(S.busy) return;
  const ta=$('#chatInput'); if(!ta) return;
  const q=ta.value.trim(); if(!q) return;
  if(parseHash().params.get('q')) history.replaceState(null,'','#/knowledge');
  S.busy=true; const sb=$('#sendBtn'); if(sb){sb.disabled=true; sb.innerHTML='<span class="spin"></span>';}
  ta.value=''; ta.style.height='auto'; ta.style.display='';
  if(!S.activeSession){
    const s={id:uid(), userId:S.user.id, title:q.slice(0,60), createdAt:nowISO(), updatedAt:nowISO()};
    await idbPut('sessions', s); S.sessions.unshift(s); S.activeSession=s.id;
  }
  const um={id:uid(), sessionId:S.activeSession, userId:S.user.id, role:'user', content:q, createdAt:nowISO()};
  await idbPut('messages', um); S.messages.push(um);
  renderChatMessages();
  const sc=$('#chatScroll');
  const pend=document.createElement('div'); pend.className='msg ai'; pend.id='pendMsg';
  pend.innerHTML=`<div class="who">Scholar</div><div class="bubble"><ul class="steps">
    <li data-st="0">Retrieving from ${esc(scopeLabel())}</li><li data-st="1">Ranking passages by relevance</li><li data-st="2">Composing grounded answer</li></ul></div>`;
  sc.appendChild(pend); sc.scrollTop=sc.scrollHeight;
  const step = async i => { const li=pend.querySelector(`[data-st="${i}"]`); if(li) li.classList.add('done'); };
  try{
    let res;
    if(S.profMode && S.tutorState && S.tutorState.active){
      res = evaluateTutor(q);
    } else {
      try{ res = await routeAnswer(q, step); }
      catch(err){ res = {content:'Something went wrong while retrieving: '+String(err).slice(0,200)+'\n\nYour documents are safe — please try again.', evidence:[], meta:{engine:'local',label:'Insufficient evidence',stamp:'dim',scope:scopeLabel(),retrieved:0}}; }
    }
    await step(2);
    const am={id:uid(), sessionId:S.activeSession, userId:S.user.id, role:'assistant', content:res.content, evidence:res.evidence||[], meta:res.meta||{}, createdAt:nowISO()};
    await idbPut('messages', am); S.messages.push(am);
    markMile('ask');
    const s=S.sessions.find(x=>x.id===S.activeSession); if(s){ s.updatedAt=nowISO(); await idbPut('sessions', s); }
    S.lastAnswer = am;
    if(S.pendingQuote) S.pendingQuote=null;
    S.busy=false; renderApp();
  }catch(err){
    S.busy=false; pend.remove();
    const sb2=$('#sendBtn'); if(sb2){sb2.disabled=false; sb2.innerHTML='<i data-lucide="arrow-up"></i>'; refreshIcons();}
    toast('Could not complete the answer: '+String(err).slice(0,160),'err');
  }
}

async function runSearch(q){
  const box=$('#searchResults'); if(!box) return;
  q=q.trim();
  if(q.length<2){ box.innerHTML='<p class="small dim3" style="padding:14px 4px">Results appear here as you type.</p>'; return; }
  await ensureIndex();
  const qt=[...new Set(tokenize(q))]; if(!qt.length){ box.innerHTML='<p class="small dim3">Please use searchable words.</p>'; return; }
  const res=[];
  const hl = t=>{ const s=esc(t); let out=s, done=false;
    for(const w of qt){ const re=new RegExp('('+escapeRe(w)+')','gi'); if(re.test(out)&&!done){ out=out.replace(re,'<mark>$1</mark>'); done=true; } }
    return out; };
  const snippet = (text)=>{ const low=text.toLowerCase(); let idx=-1;
    for(const w of qt){ const i=low.indexOf(w); if(i>=0&&(idx<0||i<idx)) idx=i; }
    if(idx<0) idx=0; const st=Math.max(0,idx-90);
    return (st>0?'…':'')+text.slice(st, st+220)+ (st+220<text.length?'…':''); };
  if(searchFilter==='all'||searchFilter==='pages'){
    const hits=bm25(S.index, qt).slice(0,14);
    hits.forEach(h=>res.push({score:h.score, type:'Page', title:docTitle(h.e.c.docId), sub:'p. '+h.e.c.page, snippet:snippet(h.e.c.text), go:()=>go('#/read/'+h.e.c.docId+'?page='+h.e.c.page)}));
  }
  if(searchFilter==='all'||searchFilter==='documents'){
    S.docs.filter(d=>d.status==='ready').forEach(d=>{
      const t=d.title.toLowerCase(); let sc=0;
      qt.forEach(w=>{ if(t.includes(w)) sc+=3; });
      if(sc>0) res.push({score:sc+2, type:'Document', title:d.title, sub:`${d.type} · ${d.pageCount} pages`, snippet:'Catalogue '+d.catNo+' — indexed '+d.chunkCount+' passages', go:()=>go('#/read/'+d.id)});
    });
  }
  if(searchFilter==='all'||searchFilter==='notes'){
    S.notes.forEach(n=>{
      const t=(n.title+' '+n.body).toLowerCase(); let sc=0;
      qt.forEach(w=>{ if(n.title.toLowerCase().includes(w)) sc+=3; if(t.includes(w)){sc+=1;} });
      if(sc>0) res.push({score:sc+1, type:'Note', title:n.title, sub:fmtWhen(n.updatedAt), snippet:snippet(n.body), go:()=>go('#/notes?id='+n.id)});
    });
  }
  if(searchFilter==='all'||searchFilter==='annotations'){
    S.annotations.forEach(a=>{
      const t=(a.quote+' '+a.comment).toLowerCase();
      if(qt.some(w=>t.includes(w))) res.push({score:1.5, type:'Annotation', title:(a.comment||a.quote).slice(0,64), sub:(a.author||'—')+' · p. '+a.page, snippet:snippet(a.quote), go:()=>go('#/read/'+a.docId+'?page='+a.page)});
    });
  }
  if(searchFilter==='all'||searchFilter==='flashcards'){
    S.flashcards.filter(c=>!c.orphan).forEach(c=>{
      const t=(c.front+' '+c.back).toLowerCase();
      if(qt.some(w=>t.includes(w))) res.push({score:1, type:'Flashcard', title:c.front.slice(0,80), sub:(c.back||'').slice(0,40), snippet:snippet(c.back||''), go:()=>go('#/learn')});
    });
  }
  if(searchFilter==='all'||searchFilter==='drafts'){
    S.drafts.forEach(d=>{
      const t=(d.title+' '+d.body).toLowerCase(); let sc=0;
      qt.forEach(w=>{ if(d.title.toLowerCase().includes(w)) sc+=3; if(t.includes(w)) sc+=1; });
      if(sc>0) res.push({score:sc, type:'Draft', title:d.title, sub:(d.body.match(/\S+/g)||[]).length+' words', snippet:snippet(d.body), go:()=>go('#/write?id='+d.id)});
    });
  }
  if(searchFilter==='all'||searchFilter==='datasets'){
    S.datasets.forEach(d=>{
      const t=(d.title+' '+d.header.join(' ')).toLowerCase();
      if(qt.some(w=>t.includes(w))) res.push({score:1, type:'Dataset', title:d.title, sub:d.rowCount+' rows × '+d.header.length+' cols', snippet:'Columns: '+d.header.slice(0,6).join(', ')+(d.header.length>6?'…':''), go:()=>go('#/datalab?ds='+d.id)});
    });
  }
  let convPainted=false;
  if(searchFilter==='all'||searchFilter==='conversations'){
    idbAllIdx('messages','userId',S.user.id).then(msgs=>{
      msgs.forEach(m=>{
        const t=m.content.toLowerCase(); if(!qt.some(w=>t.includes(w))) return;
        const sess=S.sessions.find(s=>s.id===m.sessionId);
        res.push({score:1, type:'Conversation', title:sess?sess.title:'Conversation', sub:(m.role==='user'?'You: ':'Scholar: ')+fmtWhen(m.createdAt), snippet:snippet(m.content), go:()=>go('#/knowledge?session='+m.sessionId)});
      });
      paint(true);
    });
  }
  paint(false);
  function paint(conv){
    if(conv===false && (searchFilter==='all'||searchFilter==='conversations') && !convPainted){ return; }
    if(conv) convPainted=true;
    res.sort((a,b)=>b.score-a.score);
    if(!res.length && (conv||!(searchFilter==='all'||searchFilter==='conversations'))){
      box.innerHTML='<div class="empty"><div class="serif">No matches.</div>Try different terms — search covers document text, pages, notes, annotations, flashcards, drafts, datasets and conversations.</div>'; return;
    }
    if(!res.length) return;
    box.innerHTML = '<div class="led">'+res.slice(0,30).map((r,i)=>`
      <div class="result" data-ri="${i}" role="button" tabindex="0" aria-label="Open result: ${esc(r.title)}">
        <div class="rt"><span class="tag">${r.type}</span><span class="serif">${esc(r.title)}</span><span class="mono small dim3" style="margin-left:auto">${esc(r.sub)}</span></div>
        <div class="rs">${hl(r.snippet)}</div>
      </div>`).join('')+'</div>';
    $$('#searchResults .result').forEach((elm,i)=>{
      const open=()=>{ const r=res.slice(0,30)[+elm.dataset.ri]; if(r) r.go(); };
      elm.addEventListener('click',open);
      elm.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();open();} });
    });
  }
}

function findMatches(pages, q){
  const out=[]; const low=q.toLowerCase();
  pages.forEach(p=>{ const t=p.text.toLowerCase(); let i=t.indexOf(low);
    while(i>=0){ out.push({page:p.n, idx:i, len:low.length}); i=t.indexOf(low,i+low.length); } });
  return out;
}
function markPage(text, matches, pageN){
  const ms = matches.filter(m=>m.page===pageN).map(m=>({start:m.idx, end:m.idx+m.len}));
  if(!ms.length) return esc(text);
  let out='', pos=0;
  ms.sort((a,b)=>a.start-b.start).forEach(m=>{
    if(m.start<pos) return;
    out += esc(text.slice(pos,m.start)) + '<mark>' + esc(text.slice(m.start,m.end)) + '</mark>';
    pos=m.end;
  });
  out += esc(text.slice(pos));
  return out;
}
function scrollToMatch(){
  const m=S.readerState.matches[S.readerState.mi]; if(!m) return;
  const t=$('#pg-'+m.page); if(!t) return;
  t.scrollIntoView({block:'start'});
  $('#matchInfo').textContent=`match ${S.readerState.mi+1} / ${S.readerState.matches.length}`;
}
function setupSelBar(d){
  const body=$('#readerBody'); if(!body) return;
  document.addEventListener('mouseup', selHandler);
  function selHandler(e){
    if(!document.body.contains(body)){ document.removeEventListener('mouseup', selHandler); return; }
    const old=$('.selbar'); if(old) old.remove();
    if(e.target.closest('.selbar')) return;
    const sel=window.getSelection();
    if(!sel || sel.isCollapsed || sel.rangeCount===0) return;
    const range=sel.getRangeAt(0);
    if(!body.contains(range.commonAncestorContainer)) return;
    const text=sel.toString().trim();
    if(text.length<4 || text.length>6000) return;
    const rect=range.getBoundingClientRect();
    const pgEl = (range.startContainer.nodeType===3?range.startContainer.parentElement:range.startContainer).closest('.pg');
    const page = pgEl? +pgEl.dataset.page : 1;
    const bar=document.createElement('div'); bar.className='selbar';
    bar.innerHTML = ['selAsk:Ask AI','selAnno:Annotate','selFlash:Flashcard','selEvidence:Add to evidence','selExplain:Explain','selSimplify:Simplify','selSummarize:Summarize','selQuestion:Create question'].map(a=>{const [act,label]=a.split(':');return `<button data-action="${act}" aria-label="${label} selection">${label}</button>`;}).join('');
    document.body.appendChild(bar);
    const bw=bar.offsetWidth, bh=bar.offsetHeight;
    let top=rect.top-bh-8, left=rect.left+rect.width/2-bw/2;
    if(top<64) top=rect.bottom+8;
    left=Math.max(8, Math.min(left, innerWidth-bw-8));
    bar.style.top=top+'px'; bar.style.left=left+'px';
    bar.dataset.text=text; bar.dataset.page=page; bar.dataset.doc=d.id;
    refreshIcons();
  }
}
function selectionResultModal(title, contentMd, sourceLine){

async function selectionTransform(kind, docId, page, text){
  const d=S.docs.find(x=>x.id===docId); const title=d?d.title:'Document';
  const srcLine = `*Source: ${title}, p. ${page} — selection:* “${text.slice(0,300)}${text.length>300?'…':''}”`;
  if(kind==='summarize'){
    const ss=summarizeExtract(text, 4);
    selectionResultModal('Summary of selection', ss.map(s=>'- "'+s+'"').join('\n')+'\n\n*Extractive summary — sentences selected by term-frequency, in original order. Nothing added.*', srcLine);
  } else if(kind==='simplify'){
    const ss=sentences(text);
    selectionResultModal('Simplified selection', 'Here is your selection restructured into short, single-idea sentences (a structural simplification — the wording stays the source\'s own):\n\n'+ss.map(s=>'- '+s).join('\n'), srcLine);
  } else if(kind==='explain'){
    await ensureIndex();
    const qT=[...new Set(tokenize(text))].slice(0,10);
    const pool=S.chunksCache.filter(c=>c.docId===docId);
    const hits=qT.length&&pool.length?bm25(buildIndex(pool),qT).filter(h=>h.score>=1.2).slice(0,3):[];
    let out=`**Your selection** (from *${title}*, p. ${page}):\n\n> "${text.slice(0,500)}${text.length>500?'…':''}"\n\n`;
    if(hits.length){ out+='**Related passages elsewhere in this document**, for context:\n';
      hits.forEach(h=>{ out+=`\n> "${h.e.c.text.slice(0,260).trim()}…" — p. ${h.e.c.page}\n`; });
      out+='\n*Explain shows you the neighborhood of your selection inside your own source — a local, extractive explanation. Connect an on-device server or external provider in Settings for generative explanations.*';
    } else out+='No further indexed passages in this document relate to the selection. For a generative explanation, connect an engine in **Settings → Engines**.';
    selectionResultModal('Explain selection', out, srcLine);
  }
}

    </div>

      <div class="grade-row" role="group" aria-label="Grade your recall">
        ${[['0','Again',''],['1','Hard',''],['2','Good',''],['3','Easy','']].map(([g,l])=>`
          <button data-grade="${g}"><div class="g-l">${l}</div><div class="g-i">${previewInterval(c,+g)}</div></button>`).join('')}
      </div>
      <p class="small dim3" style="margin-top:10px;text-align:center">Keys 1–4 grade · intervals predicted by SM-2 from your own history</p>`
    :`<div style="text-align:center;margin-top:18px"><button class="btn" id="flipBtn"><i data-lucide="eye"></i>Show answer</button>
      <p class="small dim3" style="margin-top:8px">Recall out loud or in writing <em>before</em> flipping — retrieval is the point, not recognition.</p></div>`}
  </div></div>`;
  refreshIcons();
  const fb=$('#flipBtn'); if(fb) fb.addEventListener('click',()=>{ S.reviewSession.flipped=true; renderApp(); });

}

    const showing=pv.style.display!=='none';
    if(showing){ pv.style.display='none'; ta.style.display=''; btn.innerHTML='<i data-lucide="eye"></i>Preview'; }
    else { d.body=ta.value; pv.innerHTML=draftPreviewHtml(d); renderMath(pv); pv.style.display=''; ta.style.display='none'; btn.innerHTML='<i data-lucide="pen-line"></i>Edit'; }
    refreshIcons();
  });
}
function insertAtCursor(ta, text){
  const s=ta.selectionStart||0, e=ta.selectionEnd||0;
  ta.value=ta.value.slice(0,s)+text+ta.value.slice(e);
  ta.selectionStart=ta.selectionEnd=s+text.length;
  ta.focus(); ta.dispatchEvent(new Event('input'));
}

async function viewQuiz(el){

function renderQuizItem(el){

  const revealed=s.revealed;
  el.innerHTML=`<div class="page fade-in"><div class="session-wrap">
    <div class="session-top">

      <span class="tag" style="align-self:flex-start">${it.type==='mcq'?'Definition match':it.type==='cloze'?'Cloze recall':'Short answer'}</span>

            let cls='';

            return `<button class="opt-btn ${cls}" data-opt="${i}" ${revealed?'disabled':''}><span class="mono dim3" style="margin-right:8px">${i+1}.</span>${esc(o)}</button>`;
          }).join('')}
        </div>`
      :`<div style="margin-top:10px">
          <textarea class="field" id="saInput" rows="4" placeholder="Answer in your own words…" ${revealed?'disabled style="opacity:.6"':''} aria-label="Your answer">${revealed?esc(s.saText||''):''}</textarea>
          ${revealed?`<div class="slip" style="margin-top:14px">
            <div class="slip-h"><span class="slip-title">Model answer — from your source</span><span class="mono dim">p. ${it.page}</span></div>
            <blockquote>${esc(it.model)}</blockquote>
            <div class="slip-a">${S.docs.some(d=>d.id===it.docId)?`<button data-action="openEvDoc" data-doc="${it.docId}" data-page="${it.page}">Open in reader</button>`:''}</div>
          </div>
          <div style="display:flex;gap:10px;margin-top:12px">
            <button class="btn ghost" id="saOk"><i data-lucide="check"></i>I recalled it</button>
            <button class="btn danger" id="saNo"><i data-lucide="x"></i>I missed it</button>
          </div>`
          :`<button class="btn" id="saReveal" style="margin-top:12px"><i data-lucide="eye"></i>Reveal model answer</button>`}
        </div>`}
      ${revealed&&(it.type==='mcq'||it.type==='cloze')?`
        <div class="slip" style="margin-top:16px">
          <div class="slip-h"><span class="slip-title">${s.chosen===it.answer?'Correct.':'Not quite.'}</span><span class="mono dim">p. ${it.page}</span></div>
          <blockquote>${esc(it.source)}</blockquote>
          <div class="slip-a">${S.docs.some(d=>d.id===it.docId)?`<button data-action="openEvDoc" data-doc="${it.docId}" data-page="${it.page}">Open in reader</button>`:''}</div>
        </div>
        <button class="btn" id="qNext" style="margin-top:14px">${s.i+1>=s.items.length?'Finish':'Next question'} →</button>`:''}
    </div>
    <p class="small dim3" style="margin-top:12px;text-align:center">Number keys select options · every item cites its page</p>
  </div></div>`;
  refreshIcons();
  if(it.type==='short'&&!revealed){
    $('#saReveal').addEventListener('click',()=>{ s.saText=$('#saInput').value; s.revealed=true; renderQuizItem(el); });
  }
  if(it.type==='short'&&revealed){
    $('#saOk').addEventListener('click',()=>{ s.answers.push({prompt:it.prompt, ok:true}); s.i++; s.revealed=false; renderQuizItem(el); });
    $('#saNo').addEventListener('click',()=>{ s.answers.push({prompt:it.prompt, ok:false}); s.i++; s.revealed=false; renderQuizItem(el); });
  }
  if(it.options&&!revealed){
    $$('.opt-btn').forEach(b=>b.addEventListener('click',()=>{
      s.chosen=+b.dataset.opt;
      s.revealed=true;
      s.answers.push({prompt:it.prompt, ok:s.chosen===it.answer});
      renderQuizItem(el);
    }));
  }
  if(revealed&&(it.type==='mcq'||it.type==='cloze')){
    $('#qNext').addEventListener('click',()=>{ s.i++; s.revealed=false; s.chosen=null; renderQuizItem(el); });
  }
}
async function finishQuiz(el){

  exportMatrix(){

    const terms=keyTerms(docs.map(d=>d.pages.map(p=>p.text).join(' ')).join(' '), 9);
    const rows=[['Document',...terms]];
    docs.forEach(d=>{
      const tf=new Map(); tokenize(d.pages.map(p=>p.text).join(' ')).forEach(w=>tf.set(w,(tf.get(w)||0)+1));
      rows.push([d.title, ...terms.map(t=>tf.get(t)||0)]);
    });
    const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
    download('literature-matrix.csv', csv, 'text/csv');

      })});
  },
  dsOpen(el){ S.dlState.dsId=el.dataset.id; renderApp(); },
  dsExport(el){
    const ds=S.datasets.find(d=>d.id===el.dataset.id); if(!ds) return;
    const rows=[ds.header, ...ds.data];
    const csv=rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');
    download(ds.title.replace(/\W+/g,'-')+'.csv', csv, 'text/csv');
    toast('Dataset exported as CSV.','ok');
  },
  dsDelete(el){
    const ds=S.datasets.find(d=>d.id===el.dataset.id); if(!ds) return;
    confirmModal('Delete dataset "'+ds.title+'"?','The parsed data is permanently removed. Original files on your device are untouched.','Delete dataset', async ()=>{
      await idbDel('datasets', ds.id);
      S.datasets=S.datasets.filter(d=>d.id!==ds.id);
      if(S.dlState.dsId===ds.id) S.dlState.dsId=null;
      toast('Dataset deleted.','ok'); renderApp();

  },
  exportGroup(){
    const ds=S.datasets.find(d=>d.id===S.dlState.dsId); if(!ds) return;
    const g=groupBy(ds, S.dlState.gCol, S.dlState.vCol, S.dlState.agg);
    const rows=[[ds.header[S.dlState.gCol], S.dlState.agg+' of '+ds.header[S.dlState.vCol]],
      ...g.map(r=>[r.label, r.value])];
    const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
    download('groupby-'+ds.title.replace(/\W+/g,'-')+'.csv', csv, 'text/csv');

  },
  calPrev(){ S.calMonth.m--; if(S.calMonth.m<0){S.calMonth.m=11;S.calMonth.y--;} S.calSel=null; renderApp(); },
  calNext(){ S.calMonth.m++; if(S.calMonth.m>11){S.calMonth.m=0;S.calMonth.y++;} S.calSel=null; renderApp(); },
  calDay(el){ S.calSel = S.calSel===el.dataset.date? null : el.dataset.date; renderApp(); },
  clearCalSel(){ S.calSel=null; renderApp(); },
  async doneTask(el){
    const t=S.tasks.find(x=>x.id===el.dataset.id); if(!t) return;
    t.done=!t.done; await idbPut('tasks', t); sortTasks(); renderIfActive('projects'); renderIfActive('progress');
  },
  async delTask(el){
    await idbDel('tasks', el.dataset.id);

    toast('Task deleted.'); renderIfActive('projects'); renderIfActive('progress');
  },
  newNote(){
    const n={id:uid(), userId:S.user.id, title:'Untitled note', body:'', docId:null, sourceLabel:'', createdAt:nowISO(), updatedAt:nowISO(), kind:'manual'};
    idbPut('notes', n).then(()=>{ S.notes.unshift(n); S.activeNoteId=n.id; go('#/notes?id='+n.id); });
  },
  pickNote(el){ S.activeNoteId=el.dataset.id; renderApp(); },
  async saveNote(el){
    const n=S.notes.find(x=>x.id===el.dataset.id); if(!n) return;
    n.title=$('#noteTitle').value.trim()||'Untitled note'; n.body=$('#noteBody').value; n.updatedAt=nowISO();
    await idbPut('notes', n); S.notes.sort((a,b)=>b.updatedAt>a.updatedAt?1:-1);
    toast('Note saved.','ok'); renderApp();
  },
  async deleteNote(el){
    confirmModal('Delete note?','This cannot be undone.','Delete', async ()=>{
      await idbDel('notes', el.dataset.id); S.notes=S.notes.filter(n=>n.id!==el.dataset.id);
      if(S.activeNoteId===el.dataset.id) S.activeNoteId=null;
      toast('Note deleted.','ok'); renderApp();
    });

  searchFilter(el){ searchFilter=el.dataset.f; renderApp(); },
  toggleProj(el){
    const b=$('#projBody-'+el.dataset.id); if(!b) return;
    const open=b.style.display!=='none'; b.style.display=open?'none':''; el.setAttribute('aria-expanded', String(!open));
  },
  delProject(el){
    const p=S.projects.find(x=>x.id===el.dataset.id); if(!p) return;
    confirmModal('Delete project "'+p.name+'"?','Documents and notes are kept — they just leave the project.','Delete project', async ()=>{
      for(const d of S.docs) if(d.projectId===p.id){ d.projectId=null; await idbPut('documents', d); }
      for(const n of S.notes) if(n.projectId===p.id){ n.projectId=null; await idbPut('notes', n); }

      if(S.scope.id===p.id) S.scope={type:'all',id:null};

  async addBookmark(el){
    const body=$('#readerBody'); const pgEl=body?$$('.pg',body).find(p=>{const r=p.getBoundingClientRect(); return r.top>-40 && r.top<innerHeight*0.5;}):null;
    const page=pgEl?+pgEl.dataset.page:1;
    const d=S.docs.find(x=>x.id===el.dataset.id); if(!d) return;
    const b={id:uid(), userId:S.user.id, docId:d.id, page, label:'Page '+page, createdAt:nowISO()};
    await idbPut('bookmarks', b); S.bookmarks.push(b);
    toast('Bookmarked page '+page+'.','ok');
  },
  openBm(el){ go('#/read/'+el.dataset.doc+'?page='+el.dataset.page); },
  async delBm(el){ await idbDel('bookmarks', el.dataset.id); S.bookmarks=S.bookmarks.filter(b=>b.id!==el.dataset.id); toast('Bookmark removed.'); renderApp(); },
  matchPrev(){ const st=S.readerState; if(!st.matches.length)return; st.mi=(st.mi-1+st.matches.length)%st.matches.length; scrollToMatch(); },
  matchNext(){ const st=S.readerState; if(!st.matches.length)return; st.mi=(st.mi+1)%st.matches.length; scrollToMatch(); },
  selAsk(el){
    const bar=el.closest('.selbar'); const t=bar.dataset.text, pg=+bar.dataset.page, dc=bar.dataset.doc;
    bar.remove(); window.getSelection().removeAllRanges();
    S.pendingQuote={docId:dc, page:pg, text:t};
    go('#/knowledge');
  },
  selExplain(el){ const bar=el.closest('.selbar'); selectionTransform('explain', bar.dataset.doc, +bar.dataset.page, bar.dataset.text); },
  selSimplify(el){ const bar=el.closest('.selbar'); selectionTransform('simplify', bar.dataset.doc, +bar.dataset.page, bar.dataset.text); },
  selSummarize(el){ const bar=el.closest('.selbar'); selectionTransform('summarize', bar.dataset.doc, +bar.dataset.page, bar.dataset.text); },
  selFlash(el){
    const bar=el.closest('.selbar'); const t=bar.dataset.text, pg=+bar.dataset.page, dc=bar.dataset.doc;
    const d=S.docs.find(x=>x.id===dc);

    openModal({title:'New flashcard', body:`
      <label class="lbl">Front (question)</label>
      <input class="field" id="fcFront" value="Explain: ${esc(firstSent.slice(0,100))}">
      <label class="lbl" style="margin-top:12px">Back (answer)</label>
      <textarea class="field" id="fcBack" rows="4">${esc(t)}</textarea>
      <p class="mono small dim3" style="margin-top:10px">SOURCE: ${esc((d?d.title:'doc')+' · p.'+pg)}</p>`,
      actions:`<button class="btn quiet" data-mclose>Cancel</button><button class="btn" id="fcGo">Save card</button>`,
      onOpen:ov=>ov.querySelector('#fcGo').addEventListener('click',async ()=>{
        const card={id:uid(), userId:S.user.id, docId:dc, page:pg,

          sourceLabel:(d?d.title:'doc')+' · p.'+pg, state:'new', ease:2.5, interval:0, reps:0, lapses:0, due:nowISO(), createdAt:nowISO()};
        await idbPut('flashcards', card); S.flashcards.push(card);
        closeModal(); toast('Flashcard saved — schedule it from Learn.','ok');
      })});
  },
  async selEvidence(el){
    const bar=el.closest('.selbar'); const t=bar.dataset.text, pg=+bar.dataset.page, dc=bar.dataset.doc;
    const d=S.docs.find(x=>x.id===dc);

    markMile('ev');
    toast('Saved to Evidence Locker.','ok');
  },
  selQuestion(el){
    const bar=el.closest('.selbar'); const t=bar.dataset.text, pg=+bar.dataset.page, dc=bar.dataset.doc;
    const d=S.docs.find(x=>x.id===dc);

    openModal({title:'Create question', body:`
      <label class="lbl">Question (front)</label>
      <input class="field" id="qFront" value="Explain: ${esc(sentences(t)[0] ? sentences(t)[0].slice(0,90) : t.slice(0,90))}">
      <label class="lbl" style="margin-top:12px">Expected answer (back) — pre-filled from your selection, edit freely</label>
      <textarea class="field" id="qBack" rows="5">${esc(t)}</textarea>
      <p class="mono small dim3" style="margin-top:10px">TRACEABLE: ${esc((d?d.title:'doc')+' · p.'+pg)}</p>`,
      actions:`<button class="btn quiet" data-mclose>Cancel</button><button class="btn" id="qSave">Save question</button>`,
      onOpen:ov=>ov.querySelector('#qSave').addEventListener('click',async ()=>{
        const front=ov.querySelector('#qFront').value.trim(), back=ov.querySelector('#qBack').value;
        const n={id:uid(), userId:S.user.id, title:'Q. '+front.slice(0,60), body:'**Q.** '+front+'\n\n**A.** '+back+'\n\n*Source: '+(d?d.title:'document')+', p.'+pg+'*', docId:dc, sourceLabel:(d?d.title:'')+' · p.'+pg, createdAt:nowISO(), updatedAt:nowISO(), kind:'question'};
        await idbPut('notes', n); S.notes.unshift(n); closeModal(); toast('Question saved to Notes.','ok');
      })});
  },
  openEvDoc(el){ go('#/read/'+el.dataset.doc+'?page='+el.dataset.page); },
  async saveEv(el){
    const e={id:uid(), userId:S.user.id, docId:el.dataset.doc, docTitle:el.dataset.t, page:+el.dataset.page, excerpt:el.dataset.x, createdAt:nowISO()};
    await idbPut('evidence', e); S.evidence.push(e);
    markMile('ev');
    toast('Saved to Evidence Locker.','ok');
    if($('#rtSaved')) setRailTab('saved');
  },
  jumpEv(){ /* handled by hookCites */ },
  newDraft(){
    const d={id:uid(), userId:S.user.id, title:'Untitled draft', body:'', citations:[], goal:0, createdAt:nowISO(), updatedAt:nowISO()};
    idbPut('drafts', d).then(()=>{ S.drafts.unshift(d); S.activeDraftId=d.id; go('#/write?id='+d.id); });
  },
  pickDraft(el){ S.activeDraftId=el.dataset.id; renderApp(); },
  async saveDraft(el){
    const d=S.drafts.find(x=>x.id===el.dataset.id); if(!d) return;
    d.title=$('#draftTitle').value.trim()||'Untitled draft'; d.body=$('#draftBody').value; d.updatedAt=nowISO();
    await idbPut('drafts', d); S.drafts.sort((a,b)=>b.updatedAt>a.updatedAt?1:-1);
    toast('Draft saved.','ok'); renderApp();
  },
  async deleteDraft(el){
    confirmModal('Delete draft?','This cannot be undone.','Delete', async ()=>{
      await idbDel('drafts', el.dataset.id); S.drafts=S.drafts.filter(d=>d.id!==el.dataset.id);
      if(S.activeDraftId===el.dataset.id) S.activeDraftId=null;
      toast('Draft deleted.','ok'); renderApp();
    });
  },
  citeInsert(el){
    const d=S.drafts.find(x=>x.id===el.dataset.id); if(!d) return;
    const evItems=S.evidence.filter(e=>!e.deleted);
    const docs=S.docs.filter(x=>x.status==='ready');
    openModal({title:'Insert citation', wide:true,
      body:`${evItems.length?`<p class="mono small dim3" style="margin-bottom:6px">FROM EVIDENCE LOCKER (ONE CLICK)</p>
        <div class="led" style="margin-bottom:16px">${evItems.slice(0,8).map(e=>`
          <div class="led-row"><span class="cat-no">EVID</span>
            <div style="min-width:0;flex:1;cursor:pointer" data-action="citeFromEv" data-id="${d.id}" data-eid="${e.id}" role="button" tabindex="0">
              <div class="led-title" style="font-size:14px">${esc(e.docTitle)}</div><div class="led-meta">p. ${e.page}</div></div>
          </div>`).join('')}</div>`:''}
        <p class="mono small dim3" style="margin-bottom:6px">FROM ANY DOCUMENT (SET PAGE)</p>
        <div class="led">${docs.map(x=>`
          <div class="led-row"><span class="cat-no">${esc(x.catNo)}</span>
            <div style="min-width:0;flex:1"><div class="led-title" style="font-size:14px">${esc(x.title)}</div></div>
            <input type="number" min="1" max="${x.pageCount}" value="1" class="field" style="width:70px;padding:4px 8px;font-size:12px" data-pagefor="${x.id}" aria-label="Page for ${esc(x.title)}">
            <button class="btn sm ghost" data-action="citeFromDoc" data-id="${d.id}" data-doc="${x.id}">Cite</button>
          </div>`).join('')}</div>`});
  },
  async citeFromEv(el){
    const d=S.drafts.find(x=>x.id===el.dataset.id); const e=S.evidence.find(x=>x.id===el.dataset.eid);
    if(!d||!e) return;
    const n=(d.citations||[]).length+1;
    d.citations=[...(d.citations||[]),{n, docId:e.docId, title:e.docTitle, page:e.page}];
    await idbPut('drafts', d);
    const ta=$('#draftBody'); if(ta) insertAtCursor(ta, ` [^${n}]`);
    closeModal(); toast(`Citation [^${n}] inserted at cursor.`,'ok'); renderApp();
  },
  async citeFromDoc(el){
    const d=S.drafts.find(x=>x.id===el.dataset.id);
    const doc=S.docs.find(x=>x.id===el.dataset.doc);
    const pageInput=$(`[data-pagefor="${el.dataset.doc}"]`);
    const page=Math.max(1,Math.min(doc.pageCount, +((pageInput&&pageInput.value)||1)));
    if(!d||!doc) return;
    const n=(d.citations||[]).length+1;
    d.citations=[...(d.citations||[]),{n, docId:doc.id, title:doc.title, page}];
    await idbPut('drafts', d);
    const ta=$('#draftBody'); if(ta) insertAtCursor(ta, ` [^${n}]`);
    closeModal(); toast(`Citation [^${n}] inserted — ${doc.title}, p. ${page}.`,'ok'); renderApp();
  },
  setGoal(el){
    const d=S.drafts.find(x=>x.id===el.dataset.id); if(!d) return;
    openModal({title:'Word goal', body:`<label class="lbl">Target words (0 = none)</label><input class="field" id="goalIn" type="number" min="0" value="${d.goal||0}">`,
      actions:`<button class="btn quiet" data-mclose>Cancel</button><button class="btn" id="goalGo">Set</button>`,
      onOpen:ov=>ov.querySelector('#goalGo').addEventListener('click',async ()=>{
        d.goal=Math.max(0,+ov.querySelector('#goalIn').value||0);
        await idbPut('drafts', d); closeModal(); toast(d.goal?('Goal set: '+d.goal+' words.'):'Goal removed.','ok'); renderApp();
      })});
  },
  exportDraft(el){
    const d=S.drafts.find(x=>x.id===el.dataset.id); if(!d) return;
    let out=d.body;
    if(d.citations&&d.citations.length){
      out+='\n\n## Citations\n'+d.citations.map(c=>`[^${c.n}]: ${c.title}, p. ${c.page}`).join('\n');
    }
    download(d.title.replace(/\W+/g,'-')+'.md', out, 'text/markdown');
    toast('Draft exported as Markdown.','ok');
  },
  exportAll(){
    idbAllIdx('messages','userId',S.user.id).then(msgs=>{
      const payload={ exportedAt:nowISO(), product:'SriVerse Scholar v5.0 (complete release)', user:{name:S.user.name, id:S.user.id},
        documents:S.docs, notes:S.notes, projects:S.projects, bookmarks:S.bookmarks, evidence:S.evidence,
        sessions:S.sessions, messages:msgs, flashcards:S.flashcards, quizzes:S.quizzes, plans:S.plans,
        drafts:S.drafts, reviewlog:S.reviewlog, datasets:S.datasets, tasks:S.tasks, annotations:S.annotations,
        note:'Chunks are included inside documents as pages[].' };
      download('sriverse-scholar-export-'+Date.now()+'.json', JSON.stringify(payload,null,2), 'application/json');
      toast('Full export downloaded — your data is yours.','ok');

  },
  clearSessions(){
    confirmModal('Clear all conversations?','Every chat session and message will be deleted. Documents and notes are kept.','Clear conversations', async ()=>{
      const msgs=await idbAllIdx('messages','userId',S.user.id);
      for(const m of msgs) await idbDel('messages', m.id);
      for(const s of S.sessions) await idbDel('sessions', s.id);
      S.sessions=[]; S.messages=[]; S.activeSession=null; S.lastAnswer=null;
      toast('Conversations cleared.','ok'); renderApp();
    });
  },
  deleteAllDocs(){
    confirmModal('Delete all documents?','All documents, their chunks, bookmarks, annotations and evidence references will be permanently removed.','Delete everything', async ()=>{
      for(const d of [...S.docs]) await deleteDoc(d.id);
      toast('All documents removed.','ok'); renderApp();
    });
  },
  deleteAccount(){
    confirmModal('Delete account and ALL data?','This removes your account, documents, notes, annotations, cards, quizzes, drafts, datasets, tasks, conversations, evidence — everything stored in this browser. Export first if you need a backup.','Delete everything permanently', async ()=>{
      for(const d of [...S.docs]) await deleteDoc(d.id);
      const msgs=await idbAllIdx('messages','userId',S.user.id);
      for(const m of msgs) await idbDel('messages', m.id);
      for(const s of S.sessions) await idbDel('sessions', s.id);
      for(const n of S.notes) await idbDel('notes', n.id);
      for(const e of S.evidence) await idbDel('evidence', e.id);
      for(const p of S.projects) await idbDel('projects', p.id);
      for(const b of S.bookmarks) await idbDel('bookmarks', b.id);
      for(const c of S.flashcards) await idbDel('flashcards', c.id);
      for(const q of S.quizzes) await idbDel('quizzes', q.id);
      for(const p of S.plans) await idbDel('plans', p.id);
      for(const d of S.drafts) await idbDel('drafts', d.id);
      for(const r of S.reviewlog) await idbDel('reviewlog', r.id);
      for(const d of S.datasets) await idbDel('datasets', d.id);
      for(const t of S.tasks) await idbDel('tasks', t.id);
      for(const a of S.annotations) await idbDel('annotations', a.id);
      await idbDel('users', S.user.id);
      localStorage.removeItem('sv_session'); localStorage.removeItem('sv_prefs_'+S.user.id);
      S.user=null; toast('Account and all data deleted.','ok'); go('#/auth'); route();
    }, true);
  },
};
function download(name, content, mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:mime+';charset=utf-8'}));
  a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-action]');
  if(!el) return;
  const fn=Actions[el.dataset.action];
  if(fn){ e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){
    e.preventDefault();
    palState.open? closePalette() : (S.user && openPalette());
    return;
  }
  const inField=/input|textarea|select/i.test(document.activeElement.tagName);
  if(e.key==='/' && !inField && !palState.open && S.user){ e.preventDefault(); go('#/search'); }
  if(e.key==='?' && !inField && !palState.open && S.user){ e.preventDefault(); Actions.shortcuts(); }
  if(e.key==='Escape'){
    closeModal();
    if(palState.open) closePalette();
    const sb=$('.selbar'); if(sb) sb.remove();
    const dr=$('.drawer'); if(dr){dr.remove(); const o=$('.drawer-ov'); if(o)o.remove();}
    if(S.readerAnnoOpen){ S.readerAnnoOpen=false; renderApp(); }
  }
  if(palState.open) return;
  if(S.route==='review' && S.reviewSession && !$('.modal-ov')){
    const s=S.reviewSession;
    if(!s.flipped && (e.key===' '||e.key==='Enter')){ e.preventDefault(); s.flipped=true; renderApp(); }
    else if(s.flipped && ['1','2','3','4'].includes(e.key)){
      const btn=$$('.grade-row button')[+e.key-1]; if(btn) btn.click();
    }
  }
  if(S.route==='quiz' && S.quizSession && !$('.modal-ov')){
    const it=S.quizSession.items[S.quizSession.i];
    if(it && it.options && !S.quizSession.revealed){
      const n=+e.key;
      if(n>=1 && n<=it.options.length){ const b=$$('.opt-btn')[n-1]; if(b) b.click(); }
    }
  }
});

/* ---------- boot ---------- */
(async function boot(){
  applyTheme();
  const sid=localStorage.getItem('sv_session');
  if(sid){
    try{
      const u=await idbGet('users', sid);
      if(u){ S.user=u; loadPrefs(); await loadUserData(); }
      else localStorage.removeItem('sv_session');
    }catch(err){ console.warn('Storage unavailable:', err); }
  }
  if(!location.hash) location.hash = S.user? '#/home':'#/auth';
  route();
})();
</script>
