<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f2ea">
<title>SriVerse Scholar — One Intelligent Workspace for Learning, Teaching & Research</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f6f2ea'/%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%238a3324' stroke-width='2'/%3E%3Ctext x='32' y='41' font-family='Georgia' font-size='26' fill='%238a3324' text-anchor='middle' font-weight='bold'%3ESV%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --paper:#f6f2ea; --surface:#fcfaf4; --surface2:#efe9dc;
  --ink:#1c1914; --ink2:#5c5442; --ink3:#8a8170;
  --line:#e0d8c6; --line2:#cfc5ad;
  --accent:#8a3324; --accent-ink:#6e281b; --accent-soft:#f0e2d8;
  --ok:#3e6b4a; --ok-soft:#e4ede4;
  --warn:#9c6b1f; --warn-soft:#f3ead4;
  --dim:#6b655a; --dim-soft:#ece7db;
  --danger:#8a3324;
  --shadow:0 1px 2px rgba(28,25,20,.06),0 8px 28px rgba(28,25,20,.07);
  --shadow-lg:0 4px 12px rgba(28,25,20,.1),0 24px 60px rgba(28,25,20,.16);
  --r:10px; --serif:'Fraunces',Georgia,serif; --sans:'Instrument Sans',sans-serif; --mono:'Spline Sans Mono',monospace;
}
[data-theme="dark"]{
  --paper:#171412; --surface:#1f1b18; --surface2:#282320;
  --ink:#ece5d8; --ink2:#b0a691; --ink3:#7e7666;
  --line:#322b25; --line2:#453b32;
  --accent:#d99a66; --accent-ink:#e5b48d; --accent-soft:#33271f;
  --ok:#8fbf9c; --ok-soft:#22301f;
  --warn:#d9b36a; --warn-soft:#322a18;
  --dim:#938b7c; --dim-soft:#2a2521;
  --danger:#d98a76;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.4);
  --shadow-lg:0 4px 12px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:var(--ink)}
a{color:var(--accent)}
h1,h2,h3,.serif{font-family:var(--serif)}
.mono{font-family:var(--mono)}
.dim{color:var(--ink2)}
.dim3{color:var(--ink3)}
.small{font-size:12.5px}
.hairline{border:0;border-top:1px solid var(--line);margin:18px 0}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface2);white-space:nowrap}
/* ============ COMPONENTS ============ */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--paper);border-radius:var(--r);font-weight:500;font-size:14px;transition:filter .15s, transform .06s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line2)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.quiet{background:transparent;color:var(--ink2);border-color:var(--line)}
.btn.quiet:hover{color:var(--ink);background:var(--surface2)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:var(--paper)}
.btn.sm{padding:5px 11px;font-size:13px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid transparent;background:transparent;color:var(--ink2);border-radius:8px;transition:all .15s}
.icon-btn:hover{color:var(--ink);background:var(--surface2);border-color:var(--line)}
.icon-btn.danger:hover{color:var(--danger)}
.icon-btn svg{width:16px;height:16px}
.field{width:100%;padding:9px 12px;border:1px solid var(--line2);background:var(--surface);border-radius:var(--r);transition:border-color .15s}
.field:focus{border-color:var(--accent);outline:none}
textarea.field{resize:vertical;min-height:80px;line-height:1.6}
label.lbl{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px;font-family:var(--mono)}
.stamp{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid;font-weight:500;white-space:nowrap}
.stamp.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.stamp.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.stamp.dim{color:var(--dim);border-color:var(--ink3);background:var(--dim-soft)}
.stamp.ext{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line2);color:var(--ink2);padding:2px 7px;border-radius:4px}
.spin{width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeUp .28s ease both}
.switch{position:relative;width:36px;height:20px;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;z-index:2;margin:0}
.switch .tr{position:absolute;inset:0;background:var(--line2);border-radius:99px;transition:background .18s}
.switch .tr::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;background:var(--surface);border-radius:50%;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+.tr{background:var(--accent)}
.switch input:checked+.tr::after{transform:translateX(16px)}
.switch input:focus-visible+.tr{outline:2px solid var(--accent);outline-offset:2px}
.modal-ov{position:fixed;inset:0;background:rgba(20,16,10,.45);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px;animation:fadeUp .18s ease}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);max-width:560px;width:100%;max-height:86vh;display:flex;flex-direction:column;animation:fadeUp .22s ease}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:19px;font-weight:600}
.modal-b{padding:20px;overflow-y:auto}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:min(360px,90vw)}
.toast{background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow-lg);display:flex;gap:9px;align-items:flex-start;animation:fadeUp .22s ease}
.toast.err{background:#6e281b;color:#f6ede4}
.toast.ok{background:var(--ok);color:#f2f6ef}
[data-theme="dark"] .toast{background:var(--surface2);color:var(--ink);border:1px solid var(--line2)}
[data-theme="dark"] .toast.err{background:#4a2018;border-color:#7a3a2c}
[data-theme="dark"] .toast.ok{background:#24371f;border-color:#3e6b4a;color:#cfe6d0}
/* ============ COMMAND PALETTE ============ */
.pal-ov{position:fixed;inset:0;background:rgba(20,16,10,.5);backdrop-filter:blur(3px);z-index:220;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;animation:fadeUp .15s}
.pal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);width:min(580px,94vw);max-height:66vh;display:flex;flex-direction:column;overflow:hidden;animation:fadeUp .18s}
.pal input{border:0;border-bottom:1px solid var(--line);background:transparent;padding:15px 18px;font-size:16px;outline:none;width:100%}
.pal input:focus{outline:none}
.pal-list{overflow-y:auto;padding:6px}
.pal-item{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.pal-item.on{background:var(--accent-soft)}
.pal-item .hint{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;flex:none}
.pal-foot{padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3)}
/* ============ ONBOARDING ============ */
.onboard{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:18px 22px;margin:20px 0 4px}
.ob-item{display:flex;gap:11px;align-items:center;padding:6px 0;font-size:14px}
.ob-item .tick{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex:none;color:transparent}
.ob-item.done .tick{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.ob-item.done .ob-l{color:var(--ink2)}
/* ============ AUTH ============ */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth-left{padding:52px 6vw;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line);background:radial-gradient(1200px 500px at -10% -20%, var(--surface2), transparent 60%)}
.auth-right{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.wordmark{font-family:var(--serif);font-weight:600;font-size:clamp(34px,4.2vw,54px);letter-spacing:-.01em;line-height:1.05}
.wordmark em{font-style:italic;color:var(--accent)}
.promise{font-family:var(--serif);font-style:italic;font-size:clamp(15px,1.4vw,18px);color:var(--ink2)}
.verb-line{display:flex;flex-wrap:wrap;gap:0;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.verb-line span{padding:0 10px;border-right:1px solid var(--line2)}
.verb-line span:last-child{border-right:0}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:32px;width:100%;max-width:420px}
.seg{display:flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;margin-bottom:22px}
.seg button{flex:1;padding:9px;background:transparent;border:0;color:var(--ink2);font-weight:500;font-size:14px}
.seg button.on{background:var(--accent);color:var(--paper)}
/* ============ SHELL ============ */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);padding:22px 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--paper)}
.side-brand{padding:0 22px 18px;display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink)}
.side-brand .serif{font-size:17px;font-weight:600;line-height:1.15}
.side-brand .serif small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:400;margin-top:2px}
.nav-sec{padding:16px 22px 6px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 22px;color:var(--ink2);text-decoration:none;font-size:14px;border-left:2px solid transparent;transition:all .12s}
.nav-item .num{font-family:var(--mono);font-size:10px;color:var(--ink3);width:18px;flex:none}
.nav-item svg{width:15px;height:15px;flex:none}
.nav-item:hover{color:var(--ink);background:var(--surface2)}
.nav-item.on{color:var(--accent-ink);border-left-color:var(--accent);background:var(--accent-soft);font-weight:500}
[data-theme="dark"] .nav-item.on{color:var(--accent)}
.nav-item .ph{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--ink3);border:1px solid var(--line2);padding:1px 5px;border-radius:4px}
.nav-item .ph.hot{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft)}
[data-theme="dark"] .nav-item .ph.hot{color:var(--accent)}
.side-foot{margin-top:auto;padding:16px 22px 6px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.main{min-width:0;display:flex;flex-direction:column}
.page{padding:34px clamp(20px,4vw,54px) 90px;max-width:1180px;width:100%;margin:0 auto;animation:fadeUp .28s ease}
.topbar{display:none;position:sticky;top:0;z-index:60;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;justify-content:space-between;gap:10px}
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:70;background:var(--surface);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
.bottomnav a,.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10px;color:var(--ink2);text-decoration:none;background:none;border:0;border-radius:8px}
.bottomnav a.on{color:var(--accent)}
.bottomnav svg{width:18px;height:18px}
.drawer-ov{position:fixed;inset:0;background:rgba(20,16,10,.45);z-index:90;animation:fadeUp .18s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(300px,84vw);background:var(--surface);border-left:1px solid var(--line);z-index:95;padding:20px;overflow-y:auto;animation:fadeUp .2s}
.drawer a{display:flex;gap:10px;align-items:center;padding:9px 8px;color:var(--ink2);text-decoration:none;border-radius:8px}
.drawer a:hover{background:var(--surface2);color:var(--ink)}
/* Ledger rows */
.led{border-top:1px solid var(--line)}
.led-row{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line)}
.led-row:hover{background:var(--surface)}
.cat-no{font-family:var(--mono);font-size:11px;color:var(--ink3);width:64px;flex:none}
.led-title{font-family:var(--serif);font-size:16.5px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.led-meta{font-family:var(--mono);font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.led-actions{margin-left:auto;display:flex;gap:2px;flex:none;opacity:.35;transition:opacity .15s}
.led-row:hover .led-actions,.led-row:focus-within .led-actions{opacity:1}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:34px 0 10px}
.sec-h h2{font-size:21px;font-weight:600}
.sec-h .rule{flex:1;border-top:1px solid var(--line);transform:translateY(-4px)}
.sec-h a,.sec-h button.linkish{font-size:13px;text-decoration:none;background:none;border:0;color:var(--accent);padding:0;font-family:var(--sans)}
button.linkish{cursor:pointer}
.hero-date{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.hero-h{font-size:clamp(30px,3.6vw,42px);font-weight:600;letter-spacing:-.01em;margin:8px 0 6px;line-height:1.1}
.statline{display:flex;flex-wrap:wrap;gap:6px 0;font-family:var(--mono);font-size:12px;color:var(--ink2);margin:14px 0 4px}
.statline b{color:var(--ink);font-weight:500}
.statline .dot{margin:0 12px;color:var(--line2)}
.grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:44px;align-items:start}
.status-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
/* ============ CHAT ============ */
.chat-wrap{display:grid;grid-template-columns:1fr 300px;gap:0;height:100vh}
.chat-main{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.chat-head{padding:14px clamp(16px,3vw,32px);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--paper)}
.chat-scroll{flex:1;overflow-y:auto;padding:26px clamp(16px,3vw,36px) 20px}
.chat-input-zone{border-top:1px solid var(--line);padding:12px clamp(16px,3vw,32px) calc(14px + env(safe-area-inset-bottom));background:var(--paper)}
.chat-box{display:flex;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:8px 8px 8px 14px;transition:border-color .15s}
.chat-box:focus-within{border-color:var(--accent)}
.chat-box textarea{flex:1;border:0;background:transparent;resize:none;max-height:150px;padding:6px 0;line-height:1.5;outline:none;font-size:14.5px}
.msg{max-width:760px;margin:0 auto 22px;animation:fadeUp .25s ease}
.msg .who{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px;display:flex;gap:10px;align-items:center}
.msg.user .bubble{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;white-space:pre-wrap}
.msg.ai .bubble{border-left:2px solid var(--accent);padding-left:16px}
.prose p{margin:0 0 10px}
.prose ul,.prose ol{margin:4px 0 12px 22px}
.prose li{margin-bottom:5px}
.prose h4,.prose h3{margin:14px 0 8px;font-size:16px}
.prose blockquote{border-left:2px solid var(--line2);padding:2px 0 2px 14px;color:var(--ink2);margin:8px 0;font-style:italic}
.prose code{font-family:var(--mono);font-size:.88em;background:var(--surface2);border:1px solid var(--line);padding:1px 5px;border-radius:4px}
.prose pre{background:var(--surface2);border:1px solid var(--line);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:10px 0}
.prose pre code{background:none;border:0;padding:0}
.prose table{border-collapse:collapse;margin:10px 0;font-size:13.5px;display:block;overflow-x:auto;max-width:100%}
.prose th,.prose td{border:1px solid var(--line2);padding:6px 11px;text-align:left}
.prose th{background:var(--surface2)}
.prose .tbl-wrap{overflow-x:auto}
sup.cite{font-family:var(--mono);font-size:10.5px;margin:0 1px}
sup.cite button{border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:5px 5px 5px 0;padding:0 4px;font-family:var(--mono);font-size:10px;line-height:1.5}
sup.cite button:hover{background:var(--accent);color:var(--paper)}
sup.cite span{border:1px solid var(--line2);color:var(--ink2);border-radius:5px 5px 5px 0;padding:0 4px;font-family:var(--mono);font-size:10px;line-height:1.5}
.slip{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:11px 14px;margin-top:10px}
.slip-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.slip-title{font-family:var(--serif);font-weight:600;font-size:14px;min-width:0}
.slip blockquote{border-left:2px solid var(--accent-soft);padding-left:11px;color:var(--ink2);font-size:13.5px;font-style:italic}
.slip-a{display:flex;gap:12px;margin-top:8px}
.slip-a button{background:none;border:0;color:var(--accent);font-size:12px;padding:0;text-decoration:underline;text-underline-offset:3px}
.slip.deleted{opacity:.6}
details.process{margin-top:12px;border-top:1px dashed var(--line2);padding-top:8px}

.anno-panel{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);background:var(--surface);border-right:1px solid var(--line);z-index:85;padding:20px;overflow-y:auto;animation:fadeUp .2s;box-shadow:var(--shadow-lg)}

.notes-wrap{display:grid;grid-template-columns:290px 1fr;gap:0;height:100vh}

.search-hero{max-width:720px}

.chipbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 6px}

/* ============ LEARN ============ */
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:18px 0}
.stat-card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px}
.stat-card .n{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1}
.stat-card .l{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-top:8px}

.session-wrap{max-width:640px;margin:0 auto;padding:34px 20px 100px}

.opt-btn.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt-btn.wrong{border-color:var(--danger);background:var(--accent-soft)}

/* Research / Data Lab tables */
.matrix-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.matrix{border-collapse:collapse;font-size:13px;min-width:100%}
table.matrix th,table.matrix td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 12px;text-align:center;white-space:nowrap}

table.matrix td.cell{cursor:pointer}
table.matrix td.cell:hover{outline:1.5px solid var(--accent);outline-offset:-1.5px}
/* ============ GRAPH ============ */
.graph-wrap{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin-top:14px}
.graph-cv{display:block;width:100%;height:auto;cursor:grab;touch-action:none}
.g-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:11px;padding:4px 9px;border-radius:6px;font-family:var(--mono);transform:translate(-50%,-140%);white-space:nowrap;z-index:5;display:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--ink2);font-family:var(--mono);margin-top:10px}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);vertical-align:-1px;margin-right:5px;opacity:.75}
/* ============ PROGRESS ============ */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;width:max-content}
.heat .c{width:12px;height:12px;border-radius:3px;background:var(--surface2)}
canvas.chart{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
/* ============ CALENDAR ============ */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-family:var(--mono);font-size:10px;color:var(--ink3);text-align:center;padding:4px 0}
.cal .d{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;position:relative;background:var(--surface);cursor:pointer;min-height:34px}
.cal .d.today{border-color:var(--accent);border-width:1.5px}
.cal .d.sel{background:var(--accent-soft);border-color:var(--accent)}
.cal .d .dots{display:flex;gap:2px;position:absolute;bottom:4px}
.cal .d .dots i{width:4px;height:4px;border-radius:50%;background:var(--accent)}
.cal .d .dots i.done{background:var(--line2)}
.cal .d.other{opacity:.35}
/* settings */
.set-sec{max-width:640px;margin-bottom:38px}
/* Responsive */
@media (max-width:1080px){ .chat-wrap{grid-template-columns:1fr} .evi-rail{display:none} .grid-2{grid-template-columns:1fr} }
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex}

  .notes-editor{height:auto}
  .chat-wrap{height:calc(100vh - 62px)}
  .notes-wrap{height:calc(100vh - 62px)}
  .led-actions{opacity:1}

  .grade-row{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:40px;text-align:center">SriVerse Scholar requires JavaScript — all processing runs locally in your browser.</p></noscript>

<script>
/* ================================================================
   SriVerse Scholar — v5.0 FINAL · Complete Academic Intelligence OS
   Local-first · Zero-cost · Source-grounded by design
   P1: vault · ingestion · grounded chat · evidence · search · reader
   P2: Learn (SM-2) · Professor Mode · Research · Write · Assess
   P3: Knowledge Graph · Data Lab · Progress · Calendar & Tasks
   P4: Collaboration packs · Annotations · Verification · On-device
   v5: Command palette · onboarding · shortcuts · final polish
================================================================ */
'use strict';
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ---------- utilities ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,9);
const nowISO = () => new Date().toISOString();
const fmtDate = iso => { try{ return new Date(iso).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});}catch(e){return ''} };
const fmtWhen = iso => {
  const d = new Date(iso), s = (Date.now()-d)/1000;
  if (s<60) return 'just now'; if (s<3600) return Math.floor(s/60)+' min ago';
  if (s<86400) return Math.floor(s/3600)+' h ago'; if (s<604800) return Math.floor(s/86400)+' d ago';
  return fmtDate(iso);
};
const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const dkey = dt => { const x=new Date(dt); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function hexToRgba(hex,a){ const h=(hex||'#888888').replace('#',''); const f=h.length===3?h.split('').map(c=>c+c).join(''):h;
  const n=parseInt(f,16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function fmtN(v){ if(v==null||!isFinite(v)) return '—'; const a=Math.abs(v);
  if(a>=1e6) return (v/1e6).toFixed(1)+'M'; if(a>=1e4) return (v/1e3).toFixed(1)+'k';
  if(a>=100) return String(Math.round(v)); return String(Math.round(v*100)/100); }
function setupCanvas(cv,W,H){ const dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.aspectRatio=W+'/'+H;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); return ctx; }
function niceStep(range,target){ if(range<=0) return 1; const raw=range/Math.max(1,target);
  const mag=Math.pow(10,Math.floor(Math.log10(raw))); const n=raw/mag;
  return (n<1.5?1:n<3.5?2:n<7.5?5:10)*mag; }
function refreshIcons(){ try{ lucide.createIcons(); }catch(e){} }
function renderMath(el){
  try{
    if(window.renderMathInElement) renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},
      {left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false});
  }catch(e){}
}
function toast(msg, kind=''){ const t=document.createElement('div'); t.className='toast '+kind; t.innerHTML=`<span>${kind==='err'?'⚠':kind==='ok'?'✓':'·'}</span><span>${esc(msg)}</span>`; $('#toasts').appendChild(t); setTimeout(()=>{t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),320)}, 4200); }
function openModal({title, body, actions, onOpen, wide}){
  closeModal();
  const ov = document.createElement('div'); ov.className='modal-ov';
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"${wide?' style="max-width:760px"':''}>
    <div class="modal-h"><h3>${esc(title)}</h3><button class="icon-btn" data-mclose aria-label="Close dialog"><i data-lucide="x"></i></button></div>
    <div class="modal-b">${body}</div>
    ${actions?`<div class="modal-f">${actions}</div>`:''}</div>`;
  ov.addEventListener('click', e=>{ if(e.target===ov || e.target.closest('[data-mclose]')) closeModal(); });
  document.body.appendChild(ov); refreshIcons(); if(onOpen) onOpen(ov);
  return ov;
}
function closeModal(){ const m=$('.modal-ov'); if(m) m.remove(); }
function confirmModal(title, text, confirmLabel, fn, danger=true){
  openModal({title, body:`<p style="color:var(--ink2)">${text}</p>`,
    actions:`<button class="btn quiet" data-mclose>Cancel</button><button class="btn ${danger?'danger':'ghost'}" id="mConfirm">${esc(confirmLabel)}</button>`,
    onOpen: ov => ov.querySelector('#mConfirm').addEventListener('click', ()=>{ closeModal(); fn(); })});
}

/* ---------- command palette (v5) ---------- */
let palState={open:false,q:'',sel:0,items:[]};
function paletteItems(){
  const items=[];
  [['home','Home'],['knowledge','Knowledge — grounded chat'],['library','Library — my academic vault'],
   ['notes','Notes'],['search','Search everything'],['projects','Projects & tasks'],
   ['learn','Learn — spaced repetition'],['teach','Teach — Professor Mode & lessons'],
   ['research','Research Studio'],['write','Write — drafting studio'],['assess','Assess — quizzes'],
   ['datalab','Data Lab'],['graph','Knowledge Graph'],['progress','Progress'],
   ['verify','Verification — dossiers'],['collab','Collaboration — packs'],['settings','Settings']
  ].forEach(([k,l])=>items.push({label:l, hint:'Go', kw:'page open '+k, run:()=>go('#/'+k)}));
  items.push(
    {label:'New note', hint:'Create', kw:'add write', run:()=>Actions.newNote()},
    {label:'New draft', hint:'Create', kw:'add write essay', run:()=>Actions.newDraft()},
    {label:'New conversation with Scholar', hint:'Create', kw:'chat ask', run:()=>Actions.newSession()},
    {label:'Upload documents', hint:'Action', kw:'add file pdf import', run:()=>go('#/library')},
    {label:'Generate flashcards…', hint:'Action', kw:'cards learn study', run:()=>Actions.cardsGenPick()},
    {label:'Generate study notes…', hint:'Action', kw:'summary notes', run:()=>Actions.genNotesPick()},
    {label:'Start review session', hint:'Action', kw:'srs cards due', run:()=>go('#/review?deck=all')},
    {label:'Take a quiz…', hint:'Action', kw:'test assess', run:()=>go('#/assess')},
    {label:'Verify a claim', hint:'Action', kw:'check evidence conflict', run:()=>go('#/verify')},
    {label:'Create collaboration pack', hint:'Action', kw:'share export collab', run:()=>go('#/collab')},
    {label:'Export everything (JSON backup)', hint:'Action', kw:'backup data', run:()=>Actions.exportAll()},
    {label:'Toggle theme', hint:'Setting', kw:'dark light system appearance', run:()=>Actions.cycleTheme()},
    {label:'Keyboard shortcuts', hint:'Help', kw:'keys help ?', run:()=>Actions.shortcuts()}
  );
  S.docs.filter(d=>d.status==='ready').slice(0,15).forEach(d=>
    items.push({label:d.title, hint:'Document', kw:'read open doc '+d.type, run:()=>go('#/read/'+d.id)}));
  S.notes.slice(0,10).forEach(n=>
    items.push({label:n.title, hint:'Note', kw:'note open', run:()=>go('#/notes?id='+n.id)}));
  S.datasets.slice(0,8).forEach(d=>
    items.push({label:d.title, hint:'Dataset', kw:'data csv', run:()=>go('#/datalab?ds='+d.id)}));
  return items;
}
function openPalette(){
  closeModal();
  const ov=document.createElement('div'); ov.className='pal-ov'; ov.id='palOv';
  ov.innerHTML=`<div class="pal" role="dialog" aria-modal="true" aria-label="Command palette">
    <input id="palIn" placeholder="Search pages, documents, notes, actions…" aria-label="Command palette search" autocomplete="off">
    <div class="pal-list" id="palList" role="listbox"></div>
    <div class="pal-foot">↑↓ navigate · Enter open · Esc close · press <kbd>?</kbd> anywhere for all shortcuts</div>
  </div>`;
  ov.addEventListener('click',e=>{ if(e.target===ov) closePalette(); });
  document.body.appendChild(ov);
  palState={open:true,q:'',sel:0,items:[]};
  const inp=$('#palIn');
  inp.addEventListener('input',()=>{ palState.q=inp.value; palState.sel=0; paletteApply(); });
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); palState.sel=Math.min(palState.items.length-1,palState.sel+1); paletteApply(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); palState.sel=Math.max(0,palState.sel-1); paletteApply(); }
    else if(e.key==='Enter'){ e.preventDefault(); const it=palState.items[palState.sel]; closePalette(); if(it) it.run(); }
    else if(e.key==='Escape'){ closePalette(); }
  });

/* ---------- markdown (sanitized by construction) ---------- */
function inlineMd(t){
  t = esc(t);
  t = t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  t = t.replace(/\[\^(\d+)\]/g,'<sup class="cite"><span>[$1]</span></sup>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return t;
}
function md(src){
  const lines = String(src??'').replace(/\r\n?/g,'\n').split('\n');
  let html='', i=0, para=[];
  const flush=()=>{ if(para.length){ html+='<p>'+para.map(inlineMd).join('<br>')+'</p>'; para=[]; } };
  while(i<lines.length){
    const L=lines[i];
    if(/^```/.test(L)){ flush(); let code=[]; i++; while(i<lines.length && !/^```/.test(lines[i])){code.push(lines[i]);i++;} i++;
      html+='<pre><code>'+esc(code.join('\n'))+'</code></pre>'; continue; }
    if(/^(#{1,4})\s+(.*)/.test(L)){ flush(); const l=L.match(/^(#{1,4})/)[1].length; html+=`<h${Math.min(l+2,5)}>`+inlineMd(L.replace(/^#+\s*/,''))+`</h${Math.min(l+2,5)}>`; i++; continue; }
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(L)){ flush(); html+='<hr class="hairline">'; i++; continue; }
    if(/^>\s?/.test(L)){ flush(); let q=[]; while(i<lines.length && /^>\s?/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/,'')); i++; } html+='<blockquote>'+q.map(inlineMd).join('<br>')+'</blockquote>'; continue; }
    if(/^\s*\|.*\|\s*$/.test(L) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      flush(); const rows=[]; while(i<lines.length && /^\s*\|/.test(lines[i])){ rows.push(lines[i]); i++; }
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inlineMd(c.trim()));
      let t='<div class="tbl-wrap"><table><thead><tr>'+cells(rows[0]).map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
      rows.slice(2).forEach(r=>{ t+='<tr>'+cells(r).map(c=>'<td>'+c+'</td>').join('')+'</tr>'; });
      html+=t+'</tbody></table></div>'; continue; }
    if(/^\s*[-*+]\s+/.test(L)){ flush(); let li=[]; while(i<lines.length && /^\s*[-*+]\s+/.test(lines[i])){ li.push(lines[i].replace(/^\s*[-*+]\s+/,'')); i++; } html+='<ul>'+li.map(x=>'<li>'+inlineMd(x)+'</li>').join('')+'</ul>'; continue; }
    if(/^\s*\d+[.)]\s+/.test(L)){ flush(); let li=[]; while(i<lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){ li.push(lines[i].replace(/^\s*\d+[.)]\s+/,'')); i++; } html+='<ol>'+li.map(x=>'<li>'+inlineMd(x)+'</li>').join('')+'</ol>'; continue; }
    if(L.trim()===''){ flush(); i++; continue; }
    para.push(L); i++;
  }
  flush(); return html;
}

/* ---------- text engine ---------- */
const STOP = new Set(('a an the of and or to in on for with is are was were be been being this that these those it its as at by from we you i not no nor but if then than so such can could may might must will would should shall do does did done have has had about into over under again further once here there when where which who whom what why how all any both each few more most other some own same too very just also only s t don now their his her they them he she upon while during between within without through before after above below up down out off').split(' '));
function tokenize(text){ return (String(text).toLowerCase().match(/[\p{L}\p{N}]+/gu)||[]).filter(w=>w.length>1 && !STOP.has(w)); }
function sentences(text){
  const t = String(text).replace(/\s+/g,' ').trim();
  return (t.match(/[^.!?…]+[.!?…]+["'”’)\]]*|[^.!?…]+$/g) || [t]).map(s=>s.trim()).filter(s=>s.length>2);
}
function paginateText(text, per=2400){
  const ss = sentences(text); const pages=[]; let cur='', len=0;
  for(const s of ss){ if(len + s.length > per && cur){ pages.push(cur.trim()); cur=''; len=0; } cur+=s+' '; len+=s.length+1; }
  if(cur.trim()) pages.push(cur.trim());
  return pages.length?pages:[];
}
function chunkPages(pages, target=950){
  const chunks=[];
  pages.forEach((ptext,pi)=>{
    const ss = sentences(ptext); let cur='';
    for(const s of ss){
      if(cur.length + s.length > target && cur.length>220){ chunks.push({text:cur.trim(), page:pi+1}); cur=''; }
      cur += s+' ';
    }
    if(cur.trim()) chunks.push({text:cur.trim(), page:pi+1});
  });
  return chunks;
}
function summarizeExtract(text, max=5){
  const ss = sentences(text).filter(s=>s.length>40 && s.length<650);
  const tf = new Map(); ss.forEach(s=>tokenize(s).forEach(w=>tf.set(w,(tf.get(w)||0)+1)));
  return ss.map((s,i)=>{ const t=tokenize(s); const sc=t.reduce((a,w)=>a+(tf.get(w)||0),0)/Math.sqrt(t.length||1); return {s,i,sc}; })
    .sort((a,b)=>b.sc-a.sc).slice(0,max).sort((a,b)=>a.i-b.i).map(x=>x.s);
}
function keyTerms(text, n=8){
  const tf=new Map(); tokenize(text).forEach(w=>tf.set(w,(tf.get(w)||0)+1));
  return [...tf.entries()].sort((a,b)=>b[1]-a[1]).slice(0,n).map(e=>e[0]);
}
function findDefinitions(text){
  const out=[]; const seen=new Set();
  for(const s of sentences(text)){
    const m = s.match(/^([A-Z][\w'’\- ]{2,48}?)\s+(?:is|are)\s+(?:defined as|known as|referred to as|considered|called)\b/i)
           || s.match(/^([\w'’\- ]{3,48}?)\s+(?:refers to|means|denotes|describes)\b/i);
    if(m){ const term=m[1].trim().toLowerCase(); if(!seen.has(term) && term.split(' ').length<=6){ seen.add(term); out.push({term:m[1].trim(), sentence:s}); } }
    if(out.length>=6) break;
  }
  return out;
}
function definitionsByPage(pages){
  const out=[];
  pages.forEach(p=>{ findDefinitions(p.text).forEach(d=>out.push({...d, page:p.n})); });
  return out;
}
function buildIndex(chunks){
  const idx = {N:chunks.length, entries:[], avg:0, df:new Map()};
  let total=0;
  for(const c of chunks){
    const t = tokenize(c.text); const tf=new Map();
    t.forEach(w=>tf.set(w,(tf.get(w)||0)+1)); total += t.length||1;
    idx.entries.push({c, tf, len:t.length||1});
  }
  idx.avg = total/(idx.N||1);
  for(const e of idx.entries) for(const w of e.tf.keys()) idx.df.set(w,(idx.df.get(w)||0)+1);
  return idx;
}
function bm25(idx, qTokens){
  const k1=1.4,b=0.72, out=[];
  for(const e of idx.entries){
    let s=0, matched=0;
    for(const w of qTokens){ const f=e.tf.get(w); if(!f) continue; matched++;
      const df=idx.df.get(w)||0, idf=Math.log(1+(idx.N-df+.5)/(df+.5));
      s += idf*f*(k1+1)/(f+k1*(1-b+b*e.len/(idx.avg||1))); }
    if(s>0) out.push({e, score:s, matched});
  }
  out.sort((a,b)=>b.score-a.score);
  return out;
}
function bestSentences(text, qTokens, max=2){
  const scored = sentences(text).map(s=>{
    const t = tokenize(s); const set=new Set(t);
    let sc=0; qTokens.forEach(w=>{ if(set.has(w)) sc++; });
    return {s, sc: sc/Math.sqrt(t.length||1)};
  }).sort((a,b)=>b.sc-a.sc);
  return scored.filter(x=>x.sc>0).slice(0,max).map(x=>x.s);
}
function topClaimsByPage(pages, n=8){
  const tf=new Map();
  pages.forEach(p=>tokenize(p.text).forEach(w=>tf.set(w,(tf.get(w)||0)+1)));
  const all=[];
  pages.forEach(p=>{
    sentences(p.text).filter(s=>s.length>50 && s.length<420).forEach(s=>{
      const t=tokenize(s);
      const sc=t.reduce((a,w)=>a+(tf.get(w)||0),0)/Math.sqrt(t.length||1);
      all.push({s, page:p.n, sc});
    });
  });
  return all.sort((a,b)=>b.sc-a.sc).slice(0,n).sort((a,b)=>a.page-b.page||a.s.localeCompare(b.s));
}

/* ---------- IndexedDB (v5: repair missing indexes in existing stores) ---------- */
const DB_NAME='sriverse_scholar', DB_VER=5; let _db=null;
function db(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e=>{
      const d = e.target.result;
      // Upgrade older databases as well as fresh installs. Previously, an existing
      // object store was skipped entirely, leaving newly required indexes missing.
      const mk=(name, indexes)=>{
        const s = d.objectStoreNames.contains(name)
          ? e.target.transaction.objectStore(name)
          : d.createObjectStore(name,{keyPath:'id'});
        (indexes||[]).forEach(ix=>{ if(!s.indexNames.contains(ix)) s.createIndex(ix,ix); });
      };
      mk('users');
      mk('documents',['userId']);
      mk('chunks',['docId','userId']);
      mk('notes',['userId']);
      mk('sessions',['userId']);
      mk('messages',['sessionId','userId']);
      mk('bookmarks',['docId']);
      mk('evidence',['userId']);
      mk('projects',['userId']);
      mk('flashcards',['userId']);
      mk('quizzes',['userId']);
      mk('plans',['userId']);
      mk('drafts',['userId']);
      mk('reviewlog',['userId']);
      mk('datasets',['userId']);
      mk('tasks',['userId']);
      mk('annotations',['userId','docId']);
    };
    r.onsuccess=()=>{_db=r.result;res(_db)}; r.onerror=()=>rej(r.error);
  });
}
function tx(store, mode='readonly'){ return db().then(d=>d.transaction(store,mode).objectStore(store)); }
const idbPut=(st,v)=>tx(st,'readwrite').then(s=>new Promise((res,rej)=>{const q=s.put(v);q.onsuccess=res;q.onerror=()=>rej(q.error)}));
const idbDel=(st,k)=>tx(st,'readwrite').then(s=>new Promise((res,rej)=>{const q=s.delete(k);q.onsuccess=res;q.onerror=()=>rej(q.error)}));
const idbGet=(st,k)=>tx(st).then(s=>new Promise((res,rej)=>{const q=s.get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}));
const idbAll=st=>tx(st).then(s=>new Promise((res,rej)=>{const q=s.getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)}));
const idbAllIdx=(st,idx,v)=>tx(st).then(s=>new Promise((res,rej)=>{const q=s.index(idx).getAll(v);q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)}));
async function idbDelIdx(st,idx,v){ const rows=await idbAllIdx(st,idx,v); for(const r of rows) await idbDel(st,r.id); }

async function hashPw(salt, pw, rounds=4000){
  let data = new TextEncoder().encode(salt+'::'+pw);
  for(let i=0;i<rounds;i++){
    const d = await crypto.subtle.digest('SHA-256', data);
    data = new Uint8Array(d);
  }
  return [...new Uint8Array(data)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function signup(name, email, pw){
  email = email.trim().toLowerCase();
  if(!name.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw 'Please enter a valid name and email.';
  if(pw.length<6) throw 'Password needs at least 6 characters.';
  if(await idbGet('users', email)) throw 'An account with this email already exists in this browser.';
  const salt = uid()+uid();
  const user = {id:email, name:name.trim(), salt, hash:await hashPw(salt,pw), createdAt:nowISO()};
  await idbPut('users', user); return user;
}
async function signin(email, pw){
  email = email.trim().toLowerCase();
  const u = await idbGet('users', email);
  if(!u) throw 'No account found for this email in this browser.';
  if(await hashPw(u.salt, pw) !== u.hash) throw 'Incorrect password.';
  return u;
}

function providerReady(){ return !!(S.provider.baseUrl && S.provider.key && S.provider.model); }

async function callProvider(cfg, messages, maxTok=700){
  const base=(cfg.baseUrl||'').replace(/\/+$/,'');
  if(!base || !cfg.model) throw 'Endpoint not configured.';
  const ctrl = new AbortController(); const to = setTimeout(()=>ctrl.abort(), 60000);
  try{
    const headers={'Content-Type':'application/json'};
    if(cfg.key) headers['Authorization']='Bearer '+cfg.key;
    const r = await fetch(base + '/chat/completions', {method:'POST', signal:ctrl.signal, headers,
      body: JSON.stringify({model:cfg.model, messages, temperature:0.2, max_tokens:maxTok})});
    if(!r.ok){ const t = await r.text().catch(()=>''); throw (cfg.kind==='on-device'?'On-device server':'Provider')+' returned '+r.status+(t?(' — '+t.slice(0,140)):''); }
    const j = await r.json();
    const c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
    if(!c) throw 'Endpoint returned an empty response.';
    return c.trim();
  } finally { clearTimeout(to); }
}
async function listModels(cfg){
  const base=(cfg.baseUrl||'').replace(/\/+$/,'');
  const headers={}; if(cfg.key) headers['Authorization']='Bearer '+cfg.key;
  const r=await fetch(base+'/models',{headers});

  const j=await r.json();
  return (j.data||[]).map(m=>m.id).filter(Boolean);
}

const SYS_GENERAL='You are Scholar, the academic assistant inside SriVerse Scholar. Be precise, calm and scholarly. Distinguish clearly between facts, calculations, interpretations and uncertainty. Never invent citations, page numbers, quotes, statistics or research findings. If you are unsure, say so plainly.';
function remoteGeneral(cfg){

    content, evidence:[],

function remoteGrounded(cfg, q, chunks, quoteEv){
  const kind=cfg.kind||'external';
  const srcs=[];
  if(quoteEv) srcs.push({docTitle:quoteEv.docTitle, page:quoteEv.page, text:quoteEv.excerpt});
  chunks.forEach(c=>srcs.push({docTitle:docTitle(c.docId), page:c.page, text:c.text.slice(0,900)}));

    const out = esc(raw).replace(/\[(\d{1,2})\]/g,(m,n)=>{ n=+n; return (n>=1&&n<=srcs.length)?`[§${n}]`:''; });
    const evidence = srcs.map((s,i)=>({docId:(i===0&&quoteEv)?quoteEv.docId:null, docTitle:s.docTitle, page:s.page, excerpt:s.text.slice(0,420), role:i===0?'primary':'supporting', prompted:true}));

      stamp:'ext', scope:scopeLabel(), scanned:idxSize(), retrieved:srcs.length,
      note:'Generated by '+(kind==='on-device'?'your local model server from the listed excerpts. Grounding was enforced in the prompt, not guaranteed — verify against the excerpts shown.':'your external provider from the listed excerpts. Grounding was enforced in the prompt, not guaranteed — verify against the excerpts shown.')} };
  });

/* ---------- answer routing: local → on-device → external → fallback ---------- */
function classifyQ(q){
  if(/summar\w*|overview|tl;?dr|main points|key points/i.test(q)) return 'summary';
  if(/\bdefine\b|definition|what is|what are|meaning of/i.test(q)) return 'definition';
  if(/\blist\b|enumerate|examples of|types of/i.test(q)) return 'list';
  if(/^why\b|\bwhy (is|are|do|does|was|were)\b/i.test(q)) return 'explanation';
  if(/^how\b|\bhow (do|does|did|can|is|are)\b/i.test(q)) return 'process';

function scopeChunks(){
  let docs = S.docs.filter(d=>d.status==='ready');
  if(S.scope.type==='doc') docs = docs.filter(d=>d.id===S.scope.id);
  if(S.scope.type==='project'){ const pid=S.scope.id; docs = docs.filter(d=>d.projectId===pid); }
  const ids = new Set(docs.map(d=>d.id));
  return S.chunksCache.filter(c=>ids.has(c.docId));
}
function scopeLabel(){
  if(S.scope.type==='doc'){ const d=S.docs.find(x=>x.id===S.scope.id); return d?('“'+d.title+'”'):'selected document'; }
  if(S.scope.type==='project'){ const p=S.projects.find(x=>x.id===S.scope.id); return p?('project “'+p.name+'”'):'selected project'; }

function idxSize(){ return S.index?S.index.N:0; }

async function routeAnswer(q, onStep){
  await ensureIndex(); onStep && await onStep(0);
  S._pendingQ = q;
  const qTokens = [...new Set(tokenize(q))];
  const qType = classifyQ(q);
  const pool = scopeChunks();
  let quoteEv = null;
  if(S.pendingQuote){
    const d = S.docs.find(x=>x.id===S.pendingQuote.docId);
    quoteEv = { docId:S.pendingQuote.docId, docTitle:d?d.title:'Document', page:S.pendingQuote.page,
      excerpt:S.pendingQuote.text.slice(0,420), isSelection:true };
  }
  const idx = buildIndex(pool.length?pool:S.chunksCache);
  const hits = qTokens.length ? bm25(idx, qTokens) : [];
  onStep && await onStep(1);
  const top = hits[0]?hits[0].score:0;
  const coverage = hits[0] ? hits[0].matched/(qTokens.length||1) : 0;
  const kept = hits.filter(h=>h.score >= Math.max(1.2, top*0.3)).slice(0,4);
  if(S.profMode && (kept.length || quoteEv)){
    onStep && await onStep(2);
    return composeProfessor(q, kept, quoteEv);
  }
  const notes=[];
  const chain=[];
  // Prefer the selected route, then try other configured model routes. The local
  // retrieval index supplies evidence; a configured model should compose the answer
  // from that evidence instead of silently returning an extractive/local response.
  if(S.routePref==='ondevice' && ondeviceReady()) chain.push(S.ondevice);
  if(S.routePref==='external' && providerReady()) chain.push(S.provider);
  if(!S.sourceOnly || kept.length || quoteEv){
    if(S.routePref!=='ondevice' && ondeviceReady() && !chain.includes(S.ondevice)) chain.push(S.ondevice);
    if(S.routePref!=='external' && providerReady() && !chain.includes(S.provider)) chain.push(S.provider);
  }
  for(const cfg of chain){
    try{
      onStep && await onStep(2);
      if(!kept.length && !quoteEv) return await remoteGeneral(cfg);
      return await remoteGrounded(cfg, q, kept.map(h=>h.e.c), quoteEv);
    }catch(err){
      notes.push((cfg.kind==='on-device'?'On-device server unavailable':'External provider failed')+' ('+String(err).slice(0,110)+') — continuing with the next route.');
    }
  }
  if(!kept.length && !quoteEv){
    let base = S.chunksCache.length===0 ? noLibraryMsg(q) : insufficientMsg(q, hits.slice(0,2), S.sourceOnly);
    if(notes.length) base.meta.fallbackNote = notes.join(' ');
    return base;
  }
  const comp = composeLocal(q, qType, qTokens, kept, quoteEv, coverage, top, kept.length);
  if(notes.length) comp.meta.fallbackNote = notes.join(' ');
  onStep && await onStep(2);
  return comp;
}

function composeLocal(q, qType, qTokens, hits, quoteEv, coverage, top, k){
  const evidence=[]; const n = i => `[§${i+1}]`;
  const pRef = c => 'p. '+c.page;
  const label = (coverage>=0.5 && top>=2 && k>=1) ? ['Supported','ok'] : (coverage>=0.22 || top>=1.2) ? ['Partially supported','warn'] : ['Insufficient evidence','dim'];
  let body='';
  if(quoteEv){ evidence.push({...quoteEv, role:'primary'}); body += `Regarding your selection from *${quoteEv.docTitle}* (p. ${quoteEv.page}) ${n(0)}:\n\n> “${quoteEv.excerpt}”\n\n`; }
  const leads = {
    summary:'Here is a summary drawn from '+scopeLabel()+', assembled from the most relevant passages:',
    definition:'Here is how your sources address this:',
    list:'Here is what your sources contain on this:',
    explanation:'Here is what your sources say, in context:',
    process:'Here is how your sources describe it:',
    factual:'Here is what your sources say:'
  };
  body += leads[qType]+'\n';
  const parts=[];
  hits.forEach((h,i)=>{
    const c=h.e.c; const ss=bestSentences(c.text, qTokens, 2);
    if(!ss.length) ss.push(c.text.slice(0,240).trim());
    const ev = mkEv(c, i===0 && !quoteEv ? 'primary':'supporting');
    const evNo = evidence.length; evidence.push(ev);
    parts.push({strings:ss, ev, evNo, c, score:h.score});
  });
  if(qType==='summary'){
    parts.forEach(p=>{ p.strings.forEach(s=>{ body+=`\n> “${s}” — *${p.ev.docTitle}*, ${pRef(p.c)} ${n(p.evNo)}`; }); });
  } else {
    const p0=parts[0];
    body += `\nFrom *${p0.ev.docTitle}* (${pRef(p0.c)}) ${n(p0.evNo)}: “${p0.strings[0]}”\n`;
    const rest = parts.slice(1);
    if(rest.length){
      body += '\n**Supporting passages**\n';
      rest.forEach(p=>{ body+=`\n- “${p.strings[0]}” — *${p.ev.docTitle}*, ${pRef(p.c)} ${n(p.evNo)}`; });
    }
    if(parts[0].strings[1]) body += `\n\nThe same passage continues: “${parts[0].strings[1]}” ${n(p0.evNo)}`;
  }
  const verLine = label[0]==='Supported'
    ? `**Verification:** ${label[0]} — passages retrieved from ${new Set(parts.map(p=>p.ev.docTitle)).size} source(s) by keyword match; every statement above is quoted verbatim from your material.`
    : `**Verification:** ${label[0]} — the match between your question and the indexed passages is limited. Read the excerpts rather than treating this as a complete answer.`;
  body += '\n\n---\n\n'+verLine;
  return { content:body, evidence, meta:{engine:'local', label:label[0], stamp:label[1], scope:scopeLabel(), scanned:idxSize(), retrieved:parts.length+(quoteEv?1:0)} };
}
/* ---------- Professor Mode ---------- */
function composeProfessor(q, hits, quoteEv){
  let ev, ctext, page, docId, dtitle;
  if(quoteEv){ ev={...quoteEv, role:'primary'}; ctext=quoteEv.excerpt; page=quoteEv.page; docId=quoteEv.docId; dtitle=quoteEv.docTitle; }
  else { const c=hits[0].e.c; ev=mkEv(c,'primary'); ctext=c.text; page=c.page; docId=c.docId; dtitle=docTitle(c.docId); }
  const key = keyTerms(ctext, 5);
  const qType = classifyQ(q);
  const task = qType==='definition'
    ? `define the central concept of this passage in your own words`
    : qType==='why' || qType==='process'
      ? `explain, in your own words, what this passage says and why it matters`
      : `restate the main claim of this passage in your own words`;
  S.tutorState = {active:true, passage:ctext, key, docId, page, docTitle:dtitle, q};
  const body = `**Professor mode.** I won't hand you the answer — you'll build it.\n\nHere is the ground, from your source *${dtitle}* (p. ${page}):\n\n> “${ctext.slice(0,420)}${ctext.length>420?'…':''}”\n\n**Your task:** ${task}. Consider the ideas it treats as important: ${key.map(k=>'*'+k+'*').join(', ')}.\n\nReply with your attempt, and I'll check it against the passage — mechanically and honestly, term by term. No flattery, no invented praise.`;
  return { content:body, evidence:[ev],
    meta:{engine:'local', label:'Professor mode · awaiting your attempt', stamp:'warn', scope:scopeLabel(), scanned:idxSize(), retrieved:1,
      note:'Your next message will be checked against this passage by key-term overlap. This is a mechanical check, clearly labeled — not an AI judgment.'} };
}
function evaluateTutor(userText){
  const t = S.tutorState;
  const lower = userText.toLowerCase();
  const covered = t.key.filter(k=>lower.includes(k));
  const missing = t.key.filter(k=>!covered.includes(k));
  const pct = t.key.length ? covered.length/t.key.length : 0;
  const verdict = pct>=0.6
    ? `**Solid.** Your answer touches most of the passage's key ideas. Now check it against the source below — did you capture the claim itself, or only its vocabulary?`
    : pct>0 ? `**Developing.** You've addressed some of the passage's key ideas, but others are missing. Compare with the source below and note what you left out.`
    : `**Not yet.** Your answer doesn't overlap the passage's key ideas. Re-read the excerpt below and try once more — or ask me a direct question (Professor mode will keep coaching).`;
  const c = `**Checking your attempt — mechanical key-term overlap, nothing more:**\n\n- Covered (${covered.length}/${t.key.length}): ${covered.length?covered.map(k=>'*'+k+'*').join(', '):'—'}\n- Not yet addressed: ${missing.length?missing.map(k=>'*'+k+'*').join(', '):'—'}\n\n${verdict}\n\nThe passage actually says:\n\n> “${t.passage.slice(0,420)}${t.passage.length>420?'…':''}” — *${t.docTitle}*, p. ${t.page}\n\n*This check counts term overlap only. It cannot judge elegance or correctness beyond the source — that judgment stays yours.*`;
  S.tutorState = null;
  return { content:c, evidence:[{docId:t.docId, docTitle:t.docTitle, page:t.page, excerpt:t.passage.slice(0,420), role:'primary'}],
    meta:{engine:'local', label:'Professor mode · attempt checked', stamp: pct>=0.6?'ok':'warn', scope:'tutoring · '+scopeLabel(), scanned:idxSize(), retrieved:1,
      note:`Overlap score: ${Math.round(pct*100)}% of passage key terms addressed.`} };
}

/* ---------- document ingestion ---------- */
const MAX_SIZE = 20*1024*1024;
const EXT_OK = ['pdf','docx','txt','md','markdown','csv','xlsx','xls','png','jpg','jpeg','webp','gif'];
const EXT_TYPE = {pdf:'PDF', docx:'DOCX', txt:'TXT', md:'MD', markdown:'MD', csv:'CSV', xlsx:'XLSX', xls:'XLSX', png:'Image', jpg:'Image', jpeg:'Image', webp:'Image', gif:'Image'};
function readFile(file, as){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej('Could not read the file');
    as==='ab'?r.readAsArrayBuffer(file):as==='dt'?r.readAsDataURL(file):r.readAsText(file); });
}
async function nextCatNo(){
  let mx=0; S.docs.forEach(d=>{ const m=(d.catNo||'').match(/(\d+)/); if(m) mx=Math.max(mx,+m[1]); });
  return 'SV-'+String(mx+1).padStart(4,'0');
}
async function ingestFile(file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(!EXT_OK.includes(ext)) throw `“${file.name}” — unsupported file type (.${ext}). Supported: PDF, DOCX, TXT, MD, CSV, XLSX, images.`;
  if(file.size>MAX_SIZE) throw `“${file.name}” exceeds the 20 MB limit.`;
  const type = EXT_TYPE[ext];
  const doc = { id:uid(), userId:S.user.id, catNo:await nextCatNo(), title:file.name.replace(/\.[^.]+$/,''),
    type, author:'', date:fmtDate(Date.now()), addedAt:nowISO(), size:file.size, pages:[], pageCount:0,
    wordCount:0, status:'processing', statusMsg:'Queued', projectId:null, updatedAt:nowISO(), imageData:null, importedFrom:null };
  S.docs.unshift(doc); await idbPut('documents', doc); renderIfActive('library');
  try{
    let text='', pages=[];
    if(type==='PDF'){
      if(!window.pdfjsLib) throw 'PDF engine failed to load (offline?). Try again with a connection, or upload TXT/MD.';
      const ab = await readFile(file,'ab');
      const pdf = await pdfjsLib.getDocument({data:ab}).promise;
      for(let p=1;p<=pdf.numPages;p++){
        doc.statusMsg=`Extracting page ${p} of ${pdf.numPages}`; renderIfActive('library');
        const pg = await pdf.getPage(p); const tc = await pg.getTextContent();
        const t = tc.items.map(it=>it.str + (it.hasEOL?'\n':' ')).join(' ').replace(/[ \t]+/g,' ').trim();
        pages.push({n:p, text:t});
      }
      text = pages.map(p=>p.text).join('\n\n');
      if(text.replace(/\s/g,'').length<30) throw 'No extractable text found — this PDF appears to be a scan. OCR is not available.';
    } else if(type==='DOCX'){
      if(!window.mammoth) throw 'DOCX engine failed to load. Try again or upload TXT/MD.';
      const ab = await readFile(file,'ab');
      const r = await mammoth.extractRawText({arrayBuffer:ab});
      text = r.value||'';
    } else if(type==='XLSX'||type==='XLS'){
      if(!window.XLSX) throw 'Spreadsheet engine failed to load. Try again or use CSV.';
      const ab = await readFile(file,'ab');
      const wb = XLSX.read(new Uint8Array(ab), {type:'array'});
      text = wb.SheetNames.map(n=>'## Sheet: '+n+'\n'+XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n\n');
    } else if(type==='Image'){
      doc.imageData = await readFile(file,'dt');
      doc.status='stored'; doc.statusMsg='Stored — no OCR available, so this image is not searchable or citable yet.';
      doc.pages=[{n:1,text:''}]; doc.pageCount=1;
      await idbPut('documents', doc); renderIfActive('library');
      toast('Image stored. OCR is not available, so it is not indexed for questions.','ok');
      return doc;
    } else { text = await readFile(file,'text'); }
    if(!text || text.replace(/\s/g,'').length<20) throw 'No readable text found in this file.';
    doc.statusMsg='Chunking & indexing';
    if(!pages.length) pages = paginateText(text).map((t,i)=>({n:i+1, text:t}));
    doc.pages = pages; doc.pageCount = pages.length; doc.wordCount = (text.match(/[\p{L}\p{N}]+/gu)||[]).length;
    const chunks = chunkPages(pages);
    if(!chunks.length) throw 'Document produced no indexable passages.';
    for(const ch of chunks){
      await idbPut('chunks', {id:uid(), userId:S.user.id, docId:doc.id, idx:0, page:ch.page, section:null, text:ch.text});
    }
    doc.status='ready'; doc.statusMsg=''; doc.chunkCount=chunks.length;
    await idbPut('documents', doc);
    S.indexDirty = true; S.graphLayout=null;
    toast(`“${doc.title}” indexed — ${chunks.length} passages across ${pages.length} pages.`,'ok');
    renderIfActive('library'); renderIfActive('home');
    return doc;
  }catch(err){
    doc.status='failed'; doc.statusMsg=String(err && err.message ? err.message : err).slice(0,240);
    await idbPut('documents', doc); renderIfActive('library');
    toast('Ingestion failed: '+doc.statusMsg,'err');
    return doc;
  }
}
async function deleteDoc(id){
  const d = S.docs.find(x=>x.id===id); if(!d) return;
  await idbDelIdx('chunks','docId', id);

async function generateStudyNotes(docId){
  await ensureIndex();

  if(full.replace(/\s/g,'').length<200) throw 'Not enough text in this document to generate notes.';

  const terms = keyTerms(full, 8);
  const defs = findDefinitions(full);
  const ss = sentences(full).filter(s=>s.length>50 && s.length<400);
  const qs = terms.slice(0,5).map(t=>{
    const s = ss.find(x=>x.toLowerCase().includes(t));
    return {q:'What does the document say about '+t+'?', a:s?('“'+s.slice(0,220)+'”'):'(passage not isolated)'};
  });
  let md_out = `# Study notes — ${doc.title}\n\n*Generated locally by extractive analysis of “${doc.title}”. Every line below is drawn verbatim or directly from the document — nothing was invented.*\n\n`;
  md_out += `## Overview\n` + overview.map(s=>'- '+s).join('\n') + '\n\n';
  md_out += `## Key concepts\n` + terms.map(t=>'- **'+t+'**').join('\n') + '\n\n';
  if(defs.length){ md_out += `## Definitions found in the text\n` + defs.map(d=>`- **${d.term}** — “${d.sentence}”`).join('\n') + '\n\n'; }
  md_out += `## Revision questions\n` + qs.map((x,i)=>`${i+1}. ${x.q}\n   > ${x.a}`).join('\n') + '\n';
  const note = {id:uid(), userId:S.user.id, title:'Study notes — '+doc.title, body:md_out, docId, sourceLabel:doc.title+' · auto-generated', createdAt:nowISO(), updatedAt:nowISO(), kind:'generated'};
  await idbPut('notes', note); S.notes.unshift(note);
  return note;
}

/* ---------- flashcards & SM-2 ---------- */
const MIN=60000, DAY=86400000;
function gradeCard(card, g){
  const now = Date.now();
  card.lastReview = nowISO();
  if(card.ease==null) card.ease=2.5;
  if(card.interval==null) card.interval=0;
  if(g===0){
    card.lapses=(card.lapses||0)+1; card.reps=0; card.state='learning';
    card.ease=Math.max(1.3, card.ease-0.2);
    card.interval=0; card.due=new Date(now+10*MIN).toISOString(); return;
  }
  card.reps=(card.reps||0)+1;
  if(card.state!=='review'){
    let ivDays = g===1? 0.007 : g===2? 1 : 3;
    if(g===3) card.ease=Math.min(3.2, card.ease+0.15);
    if(ivDays>=1) card.state='review';
    card.interval = ivDays;
    card.due=new Date(now + ivDays*DAY).toISOString();
  } else {
    if(g===1) card.ease=Math.max(1.3, card.ease-0.15);
    if(g===3) card.ease=Math.min(3.2, card.ease+0.15);
    let mult = g===1?1.2 : g===2?card.ease : card.ease*1.3;
    card.interval = Math.max(1, card.interval*mult);
    card.due=new Date(now + card.interval*DAY).toISOString();
  }
}
function humanIv(days){ if(days<=0) return '10 min'; if(days<1) return Math.max(1,Math.round(days*24*60))+' min'; if(days<30) return Math.round(days)+' d'; return Math.round(days/30*10)/10+' mo'; }
function previewInterval(card, g){
  const c={...card}; const before=c.due; gradeCard(c,g);
  const ms=new Date(c.due)-new Date(before||Date.now()); return humanIv(ms/DAY);
}
function isDue(c){ return c.state && c.state!=='new' && c.due && new Date(c.due)<=new Date(); }
function dueCount(){ return S.flashcards.filter(c=>!c.orphan && isDue(c)).length; }
function newCount(deck){ return S.flashcards.filter(c=>!c.orphan && (!c.state||c.state==='new') && (deck==='all'||c.docId===deck)).length; }
function buildQueue(deck){
  const now = Date.now();
  const cards=S.flashcards.filter(c=>!c.orphan && (deck==='all'||c.docId===deck));
  const learning=cards.filter(c=>c.state==='learning'&&new Date(c.due).getTime()<=now).sort((a,b)=>new Date(a.due)-new Date(b.due));
  const review=cards.filter(c=>c.state==='review'&&new Date(c.due).getTime()<=now).sort((a,b)=>new Date(a.due)-new Date(b.due));
  const newC=cards.filter(c=>!c.state||c.state==='new').slice(0,15);
  return [...learning,...newC,...review];
}
async function generateFlashcards(docId, pageFrom, pageTo){
  await ensureIndex();
  const doc=S.docs.find(d=>d.id===docId); if(!doc) throw 'Document not found.';
  const pages=doc.pages.filter(p=>(!pageFrom||p.n>=pageFrom)&&(!pageTo||p.n<=pageTo));
  const full=pages.map(p=>p.text).join('\n');
  if(full.replace(/\s/g,'').length<200) throw 'Not enough text on these pages.';
  const existing=new Set(S.flashcards.filter(c=>!c.orphan).map(c=>c.front.toLowerCase()));
  const usedTerms=new Set(S.flashcards.filter(c=>!c.orphan).map(c=>(c.back||'').toLowerCase()));
  const cards=[];
  for(const d of definitionsByPage(pages)){
    const front='Define: '+d.term;
    if(existing.has(front.toLowerCase())) continue;
    cards.push({id:uid(), userId:S.user.id, docId, page:d.page, front, back:d.sentence,
      sourceLabel:doc.title+' · p.'+d.page, state:'new', ease:2.5, interval:0, reps:0, lapses:0,
      due:nowISO(), createdAt:nowISO()});
    existing.add(front.toLowerCase()); usedTerms.add(d.term.toLowerCase());
    if(cards.length>=12) break;
  }
  if(cards.length<12){
    const terms=keyTerms(full, 16);
    outer:
    for(const p of pages){
      for(const s of sentences(p.text)){
        if(s.length<60||s.length>280) continue;
        for(const t of terms){
          if(usedTerms.has(t)) continue;
          const re=new RegExp('\\b'+escapeRe(t)+'\\b','i');
          const m=s.match(re); if(!m) continue;
          const front=s.replace(re,'[ … ]');
          if(existing.has(front.toLowerCase())) continue;
          cards.push({id:uid(), userId:S.user.id, docId, page:p.n, front, back:m[0],
            sourceLabel:doc.title+' · p.'+p.n, state:'new', ease:2.5, interval:0, reps:0, lapses:0,
            due:nowISO(), createdAt:nowISO()});
          existing.add(front.toLowerCase()); usedTerms.add(t);
          if(cards.length>=12) break outer;
        }
      }
    }
  }
  if(!cards.length) throw 'No new flashcards could be extracted — the candidates already exist as cards.';
  for(const c of cards) await idbPut('flashcards', c);
  S.flashcards.push(...cards);
  return cards;
}
function calcStreak(){
  const days=new Set();
  S.reviewlog.forEach(r=>days.add(dkey(r.at)));
  S.quizzes.forEach(q=>days.add(dkey(q.at)));
  let streak=0; const d=new Date();
  if(!days.has(dkey(d))) d.setDate(d.getDate()-1);
  while(days.has(dkey(d))){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}
function deckStats(docId){
  const cards=S.flashcards.filter(c=>!c.orphan&&c.docId===docId);
  const matured=cards.filter(c=>c.state==='review'&&c.interval>=21).length;
  return {total:cards.length, due:cards.filter(isDue).length, matured,
    mastery: cards.length? Math.round(matured/cards.length*100):0};
}

/* ---------- quiz generation ---------- */
async function buildQuizItems(docId){
  await ensureIndex();
  const doc=S.docs.find(d=>d.id===docId); if(!doc) throw 'Document not found.';
  const pages=doc.pages, full=pages.map(p=>p.text).join('\n');
  if(full.replace(/\s/g,'').length<200) throw 'Not enough text to build a quiz.';
  const terms=keyTerms(full, 14);
  const defs=definitionsByPage(pages);
  const items=[];
  if(defs.length>=2){
    const pool=defs;
    shuffle(defs).slice(0,4).forEach(d=>{
      const distractors=shuffle(pool.filter(x=>x.term.toLowerCase()!==d.term.toLowerCase())).slice(0,3).map(x=>x.sentence);
      if(distractors.length<2) return;
      const options=shuffle([{t:d.sentence, ok:true}, ...distractors.map(t=>({t, ok:false}))]);
      items.push({type:'mcq', prompt:`Which definition from your vault matches “${d.term}”?`,
        options:options.map(o=>o.t), answer:options.findIndex(o=>o.ok),
        docId, page:d.page, source:'“'+d.sentence.slice(0,160)+'” — '+doc.title+', p.'+d.page});
    });
  }
  const usedT=new Set();
  for(const p of pages){
    for(const s of sentences(p.text)){
      if(items.filter(i=>i.type==='cloze').length>=4) break;
      if(s.length<60||s.length>280) continue;
      for(const t of terms){
        if(usedT.has(t)) continue;
        const re=new RegExp('\\b'+escapeRe(t)+'\\b','i');
        const m=s.match(re); if(!m) continue;
        const others=terms.filter(x=>x!==t && !usedT.has(x));
        if(others.length<3) continue;
        const opts=shuffle([{t:m[0],ok:true},...shuffle(others).slice(0,3).map(x=>({t:x,ok:false}))]);
        items.push({type:'cloze', prompt:s.replace(re,'[ … ]'), options:opts.map(o=>o.t), answer:opts.findIndex(o=>o.ok),
          docId, page:p.n, source:'“'+s.slice(0,160)+'” — '+doc.title+', p.'+p.n});
        usedT.add(t);
        break;
      }
    }
    if(items.filter(i=>i.type==='cloze').length>=4) break;
  }
  const ss=sentences(full);
  for(const t of terms.slice(0,10)){
    if(items.filter(i=>i.type==='short').length>=3) break;
    const s=ss.find(x=>x.length>60 && x.length<400 && x.toLowerCase().includes(t));
    if(!s) continue;
    const pg=pages.find(p=>p.text.includes(s.slice(0,80)));
    items.push({type:'short', prompt:`In your own words: what does the document say about **${t}**?`,
      model:'“'+s+'”', docId, page:pg?pg.n:1, source:'— '+doc.title+', p.'+(pg?pg.n:1)});
  }
  if(items.length<3) throw 'Not enough extractable material to build a meaningful quiz from this document.';
  const wrongQ=new Set(S.quizzes.filter(q=>q.docId===docId).flatMap(q=>(q.detail||[]).filter(d=>!d.ok).map(d=>d.prompt)));
  items.sort((a,b)=>(wrongQ.has(b.prompt)?1:0)-(wrongQ.has(a.prompt)?1:0));
  return items;
}

async function generateLesson(docId){
  await ensureIndex();
  const doc=S.docs.find(d=>d.id===docId); if(!doc) throw 'Document not found.';
  const pages=doc.pages, full=pages.map(p=>p.text).join('\n');
  if(full.replace(/\s/g,'').length<200) throw 'Not enough text to build a lesson.';
  const terms=keyTerms(full, 6);
  const defs=definitionsByPage(pages);
  const partSize=Math.max(1, Math.ceil(pages.length/3));
  const parts=[];
  for(let i=0;i<pages.length;i+=partSize){
    const grp=pages.slice(i,i+partSize);
    const pts=summarizeExtract(grp.map(p=>p.text).join('\n'), 2);
    parts.push({from:grp[0].n, to:grp[grp.length-1].n, points:pts});
  }
  const ss=sentences(full);
  const disc=terms.slice(0,4).map(t=>{
    const s=ss.find(x=>x.toLowerCase().includes(t));
    return `Discuss: what does the source claim about *${t}*? (${s?'see “'+s.slice(0,90)+'…”':'locate the passage'})`;
  });
  let out=`# Lesson plan — ${doc.title}\n\n*Generated by extractive analysis of “${doc.title}” (${pages.length} pages). Every item traces to the source; edit freely.*\n\n`;
  out+=`## Learning objectives\nStudents will be able to:\n`;
  out+=(defs.length?defs.slice(0,4).map(d=>`- Define **${d.term}** as the source does (p. ${d.page})`):terms.slice(0,4).map(t=>`- Explain the source's treatment of **${t}**`)).join('\n')+'\n\n';
  out+=`## Core content (by section)\n`;
  parts.forEach((p,i)=>{
    out+=`\n### Section ${i+1} · pp. ${p.from}–${p.to}\n`;
    out+=p.points.map(s=>`- “${s}” (p. ${p.from}–${p.to})`).join('\n')+'\n';
  });
  out+=`\n## Key terms\n${terms.map(t=>'- **'+t+'**').join('\n')}\n\n`;
  if(defs.length) out+=`## Glossary (verbatim from source)\n${defs.map(d=>`- **${d.term}** — “${d.sentence}”`).join('\n')}\n\n`;
  out+=`## Discussion prompts\n${disc.map(d=>'- '+d).join('\n')}\n`;
  const note={id:uid(), userId:S.user.id, title:'Lesson — '+doc.title, body:out, docId, sourceLabel:doc.title+' · lesson plan', createdAt:nowISO(), updatedAt:nowISO(), kind:'lesson'};
  await idbPut('notes', note); S.notes.unshift(note);
  return note;
}

/* ============ KNOWLEDGE GRAPH ============ */
async function buildGraphData(scope, maxNodes){
  await ensureIndex();
  const docs=S.docs.filter(d=>d.status==='ready'&&(scope==='all'||d.projectId===scope));
  const units=[];
  docs.forEach(d=>d.pages.forEach(p=>{ if(p.text) units.push({docId:d.id, docTitle:d.title, page:p.n, text:p.text}); }));
  if(!units.length) return {nodes:[], edges:[], scanned:0};
  const tf=new Map();
  units.forEach(u=>tokenize(u.text).forEach(w=>tf.set(w,(tf.get(w)||0)+1)));
  const concepts=[...tf.entries()].sort((a,b)=>b[1]-a[1]).slice(0,maxNodes).map(e=>e[0]);
  const regexes=concepts.map(c=>({c, re:new RegExp('\\b'+escapeRe(c)+'\\b','gi')}));
  const nodeMap=new Map();
  concepts.forEach(c=>nodeMap.set(c,{term:c,count:0,docs:new Map(),best:null}));
  const edgeMap=new Map();
  let scanned=0;
  units.forEach(u=>{
    sentences(u.text).forEach(s=>{
      scanned++;
      const present=[];
      for(const {c,re} of regexes){
        const m=s.match(re);
        if(m&&m.length){
          const node=nodeMap.get(c);
          node.count+=m.length;
          const dm=node.docs.get(u.docTitle)||new Set();
          dm.add(u.page); node.docs.set(u.docTitle,dm);
          if(!node.best && s.length>=60 && s.length<=320) node.best={text:s, page:u.page, docId:u.docId, docTitle:u.docTitle};
          present.push(c);
        }
      }
      for(let i=0;i<present.length;i++) for(let j=i+1;j<present.length;j++){
        const [a,b]=[present[i],present[j]].sort();
        const key=a+'||'+b;
        const e=edgeMap.get(key)||{a,b,weight:0,evidence:[]};
        e.weight++;
        if(e.evidence.length<3) e.evidence.push({docId:u.docId, docTitle:u.docTitle, page:u.page, snippet:s.slice(0,180)});
        edgeMap.set(key,e);
      }
    });
  });
  const nodes=concepts.map(c=>{
    const n=nodeMap.get(c);
    return {term:c, count:n.count, docs:[...n.docs.entries()].map(([t,ps])=>({title:t,pages:[...ps]})), best:n.best};
  }).filter(n=>n.count>0).sort((a,b)=>b.count-a.count);
  const edges=[...edgeMap.values()].sort((a,b)=>b.weight-a.weight);
  return {nodes, edges, scanned};
}
const radiusFor = c => Math.max(9, Math.min(24, 7+Math.sqrt(c)*1.1));
function layoutGraph(g){
  const W=920,H=470;
  const nodes=g.nodes.map(n=>({term:n.term, count:n.count, docsCount:n.docs.length, best:n.best,
    r:radiusFor(n.count), x:W/2+(Math.random()-.5)*W*.7, y:H/2+(Math.random()-.5)*H*.7, vx:0, vy:0}));
  const idx=new Map(nodes.map((n,i)=>[n.term,i]));
  const edges=g.edges.map(e=>({s:idx.get(e.a), t:idx.get(e.b), w:e.weight})).filter(e=>e.s!=null&&e.t!=null);
  for(let k=0;k<300;k++){
    for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j];
      const dx=b.x-a.x, dy=b.y-a.y; let d2=dx*dx+dy*dy||1;
      if(d2<90000){ const f=Math.min(4, 2400/d2), d=Math.sqrt(d2), fx=dx/d*f, fy=dy/d*f;
        a.vx-=fx; a.vy-=fy; b.vx+=fx; b.vy+=fy; }
    }
    edges.forEach(e=>{ const a=nodes[e.s], b=nodes[e.t];
      const dx=b.x-a.x, dy=b.y-a.y; const d=Math.sqrt(dx*dx+dy*dy)||1;
      const target=95+45*Math.min(e.w,5); const f=(d-target)*0.015;
      const fx=dx/d*f, fy=dy/d*f; a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy; });
    nodes.forEach(n=>{
      n.vx+=(W/2-n.x)*0.003; n.vy+=(H/2-n.y)*0.003;
      n.vx*=0.85; n.vy*=0.85;
      n.x=Math.max(36, Math.min(W-36, n.x+n.vx));
      n.y=Math.max(36, Math.min(H-36, n.y+n.vy));
    });
  }
  return {key:'', nodes, edges};
}

function drawGraph(){
  const cv=$('#graphCv'); if(!cv) return;
  const ctx=cv.getContext('2d');
  const W=920,H=470, st=S.graphState, L=S.graphLayout;
  ctx.clearRect(0,0,W,H);
  const accent=cssVar('--accent'), ink2=cssVar('--ink2');
  ctx.save();
  ctx.translate(st.view.x, st.view.y); ctx.scale(st.view.k, st.view.k);
  L.edges.forEach(e=>{
    const a=L.nodes[e.s], b=L.nodes[e.t];
    const hot = st.sel && (a.term===st.sel||b.term===st.sel);
    ctx.strokeStyle=accent;
    ctx.globalAlpha = hot?0.85 : st.sel?0.07 : Math.min(0.45, 0.12+e.w*0.07);
    ctx.lineWidth=Math.min(6, 0.8+e.w*0.7);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  });
  ctx.globalAlpha=1;
  L.nodes.forEach(n=>{
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,7);
    ctx.fillStyle=hexToRgba(accent, st.sel&&st.sel!==n.term?0.28:0.8);

    ctx.textAlign='center';
    ctx.fillText(n.term.length>18?n.term.slice(0,17)+'…':n.term, n.x, n.y+n.r+12);
  });
  ctx.restore();
}
