name: Validate SriVerse Scholar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate HTML structure and inline JavaScript syntax
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync, unlinkSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const file = 'index.html';
          const html = readFileSync(file, 'utf8');

          assert.match(html, /^<!doctype html>/i, 'Missing HTML doctype');
          assert.match(html, /<html\b/i, 'Missing html element');
          assert.match(html, /<head\b[\s\S]*?<\/head>/i, 'Missing or unclosed head');
          assert.match(html, /<body\b[\s\S]*?<\/body>/i, 'Missing or unclosed body');
          assert.match(html.trimEnd(), /<\/html>$/i, 'Missing closing html tag');
          assert.match(html, /<title>[^<]*SriVerse Scholar[^<]*<\/title>/i, 'Missing product title');
          assert.match(html, /async function boot\s*\(/, 'Application boot function not found');
          assert.match(html, /indexedDB/, 'IndexedDB persistence code not found');
          assert.doesNotMatch(html, /(?:sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{30,})/, 'Possible hard-coded secret detected');

          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)]
            .filter(([, attrs, body]) => !/\bsrc\s*=/i.test(attrs) && body.trim().length > 0);

          assert.ok(scripts.length > 0, 'No inline application JavaScript found');

          for (let i = 0; i < scripts.length; i++) {
            const temp = `/tmp/scholar-inline-${i}.js`;
            writeFileSync(temp, scripts[i][2], 'utf8');
            try {
              execFileSync(process.execPath, ['--check', temp], { stdio: 'inherit' });
            } finally {
              unlinkSync(temp);
            }
          }

          console.log(`PASS: HTML structure; ${scripts.length} inline JavaScript blocks parse; no obvious hard-coded API-key patterns.`);
          NODE
